<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생활비 통장</title>
<style>
  :root {
    color-scheme: light;
    --paper: #E9F0EC;
    --surface: #F8FBF9;
    --ink: #14322B;
    --ink-soft: #56706A;
    --pine: #1E6B57;
    --seal: #C4213A;
    --line: #C9D8D1;
    --nav-width: 13rem;
    --row: 2.75rem;
    --font: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 1rem/1.6 var(--font);
    font-variant-numeric: tabular-nums;
    word-break: keep-all;
  }

  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--pine); outline-offset: 2px; }

  .app {
    display: grid;
    grid-template-columns: var(--nav-width) minmax(0, 1fr);
    min-height: 100vh;
  }

  .nav {
    position: sticky;
    top: 0;
    align-self: start;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    height: 100vh;
    padding: 1.5rem 0.75rem;
    background: var(--ink);
    color: var(--surface);
  }
  .nav:focus-visible, .nav button:focus-visible { outline-color: var(--surface); }

  .brand {
    margin: 0 0 1.25rem;
    padding: 0 0.75rem;
    font-size: 1.125rem;
    font-weight: 700;
  }

  .nav-item {
    padding: 0.625rem 0.75rem;
    border: 0;
    border-radius: 4px;
    background: none;
    text-align: left;
  }
  .nav-item:hover { background: rgb(248 251 249 / 0.1); }
  .nav-item[aria-current="page"] {
    background: var(--surface);
    color: var(--ink);
    font-weight: 700;
  }

  .main {
    width: 100%;
    max-width: 44rem;
    margin-inline: auto;
    padding: 2.5rem 1.5rem;
  }

  .view h1 {
    margin: 0 0 1.5rem;
    font-size: 1.5rem;
    line-height: 1.3;
  }

  /* 통장 속지처럼 일정한 간격의 줄 */
  .ledger {
    min-height: calc(var(--row) * 6 + 1px);
    padding: 0 1rem;
    border-top: 2px solid var(--ink);
    background:
      repeating-linear-gradient(
        to bottom,
        transparent 0 calc(var(--row) - 1px),
        var(--line) calc(var(--row) - 1px) var(--row)
      )
      var(--surface);
  }

  .empty {
    margin: 0;
    color: var(--ink-soft);
    line-height: var(--row);
  }

  @media (max-width: 40rem) {
    .app { display: block; }

    .nav {
      position: fixed;
      inset: auto 0 0;
      z-index: 1;
      flex-direction: row;
      gap: 0;
      height: auto;
      padding: 0.25rem;
      padding-bottom: calc(0.25rem + env(safe-area-inset-bottom, 0px));
    }
    .brand { display: none; }
    .nav-item { flex: 1 1 0; padding: 0.5rem 0.25rem; font-size: 0.875rem; text-align: center; }

    .main { padding: 1.5rem 1rem 6rem; }
  }
</style>
</head>
<body>
  <div class="app" id="app">
    <nav class="nav" aria-label="메뉴">
      <p class="brand">생활비 통장</p>
      <button class="nav-item" type="button" data-view="dashboard" aria-current="page">대시보드</button>
      <button class="nav-item" type="button" data-view="calendar">달력</button>
      <button class="nav-item" type="button" data-view="weekly">주간</button>
      <button class="nav-item" type="button" data-view="piggy">저금통</button>
      <button class="nav-item" type="button" data-view="settings">설정</button>
    </nav>

    <main class="main">
      <section class="view" data-panel="dashboard">
        <h1>대시보드</h1>
        <div class="ledger"><p class="empty">이번 달 예산을 정하면 남은 돈이 여기에 표시됩니다.</p></div>
      </section>
      <section class="view" data-panel="calendar" hidden>
        <h1>달력</h1>
        <div class="ledger"><p class="empty">날짜별 지출이 여기에 표시됩니다.</p></div>
      </section>
      <section class="view" data-panel="weekly" hidden>
        <h1>주간</h1>
        <div class="ledger"><p class="empty">월요일부터 일요일까지 주별 지출이 여기에 표시됩니다.</p></div>
      </section>
      <section class="view" data-panel="piggy" hidden>
        <h1>저금통</h1>
        <div class="ledger"><p class="empty">저축하고 사용한 내역이 여기에 표시됩니다.</p></div>
      </section>
      <section class="view" data-panel="settings" hidden>
        <h1>설정</h1>
        <div class="ledger"><p class="empty">분류를 여기에서 관리합니다.</p></div>
      </section>
    </main>
  </div>

<script>
'use strict';

// ---- 화면 ----

function showView(name) {
  document.querySelectorAll('[data-panel]').forEach((panel) => {
    panel.hidden = panel.dataset.panel !== name;
  });
  document.querySelectorAll('[data-view]').forEach((item) => {
    if (item.dataset.view === name) item.setAttribute('aria-current', 'page');
    else item.removeAttribute('aria-current');
  });
}

function init() {
  document.querySelectorAll('[data-view]').forEach((item) => {
    item.addEventListener('click', () => showView(item.dataset.view));
  });
}

init();
</script>
</body>
</html>
