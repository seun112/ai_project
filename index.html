<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생활비 통장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #D9F0BC; --stripe: rgba(255,255,255,0.5); --paper: #FFFBE3; --ink: #2B4A22; --soft: #4F6B3F;
  --dot: #A8CB8B; --dash: #7FB069; --field: #FFFFFF; --accent: #8CCB4F; --accent-ink: #1F3D17;
  --yellow: #FFF1A8; --mint: #EAF6D6; --tab: #BFE08F; --tab-line: #7FA566; --seal: #C4213A;
  --track: #FFFBE3; --veil: rgba(43,74,34,0.6); --off: #E3E8D5; --off-ink: #60705A; --off-line: #A9B79A;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  background-color: var(--bg);
  background-image: linear-gradient(90deg, var(--stripe) 50%, transparent 50%), linear-gradient(var(--stripe) 50%, transparent 50%);
  background-size: 44px 44px;
  color: var(--ink);
  font-family: 'Gowun Dodum', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  font-size: 17px; line-height: 1.6;
}
button, input { font-family: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.jua { font-family: 'Jua', 'Gowun Dodum', sans-serif; font-weight: 400; }
.tnum { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1128px; margin: 0 auto; padding: 40px 24px 64px; }

/* 탭 */
.tabs { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px; padding-left: 28px; }
.tab { padding: 6px 18px 4px; border: 3px solid var(--tab-line); border-bottom: none; border-radius: 14px 14px 0 0; background: var(--tab); color: var(--ink); font-family: 'Jua', 'Gowun Dodum', sans-serif; font-size: 16px; cursor: pointer; }
.tab[aria-current="page"] { padding: 8px 22px 6px; border-color: var(--ink); background: var(--paper); font-size: 19px; cursor: default; }
.date { margin-left: auto; padding-bottom: 6px; font-family: 'Jua', 'Gowun Dodum', sans-serif; font-size: 17px; }
.date small { font-family: 'Gowun Dodum', sans-serif; color: var(--soft); font-size: 13px; }

/* 노트 */
.book { margin-top: -3px; padding: 14px; border: 4px solid var(--ink); border-radius: 28px; background: var(--paper); }
.inner { border: 2px dashed var(--dash); border-radius: 18px; padding: 28px; display: flex; flex-wrap: wrap; gap: 32px; }
.col { flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.chip { display: inline-block; padding: 2px 12px; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 14px; }
.head-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 10px; border-bottom: 2px dotted var(--dot); }
.big { font-family: 'Jua', 'Gowun Dodum', sans-serif; font-weight: 400; font-variant-numeric: tabular-nums; }
.remain { padding: 18px 20px 20px; border: 2px solid var(--ink); border-radius: 18px; background: var(--mint); display: flex; flex-direction: column; gap: 10px; }
.remain .chip { align-self: flex-start; }
.remain .big { font-size: 56px; line-height: 1.2; }
.remain .big.neg { color: var(--seal); }
.meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: 15px; color: var(--soft); }
.bar { height: 12px; border: 2px solid var(--ink); border-radius: 999px; background: var(--track); overflow: hidden; }
.bar.lg { height: 16px; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.bar.over { border-color: var(--seal); }
.bar.over > i { background: var(--seal); }
.sub { font-size: 14px; color: var(--soft); }
.over-pill { padding: 0 10px; border: 2px solid var(--seal); border-radius: 999px; color: var(--seal); font-family: 'Gowun Dodum', sans-serif; font-size: 13px; font-weight: 700; }
.neg-text { color: var(--seal); }

.entry { padding: 16px; border: 2px solid var(--ink); border-radius: 18px; background: var(--yellow); display: flex; flex-direction: column; gap: 12px; }
.entry h2, .sec-title { margin: 0; font-family: 'Jua', 'Gowun Dodum', sans-serif; font-weight: 400; font-size: 20px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { min-height: 40px; padding: 0 16px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); color: var(--ink); font-size: 16px; cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.fields { display: flex; flex-wrap: wrap; gap: 8px; }
.field { height: 46px; padding: 0 14px; border: 2px solid var(--ink); border-radius: 14px; background: var(--field); color: var(--ink); font-size: 18px; min-width: 0; }
.field.right { text-align: right; font-variant-numeric: tabular-nums; }
.field[aria-invalid="true"] { border-color: var(--seal); }
.err { margin: 0; color: var(--seal); font-size: 14px; font-weight: 700; }
.btn { min-height: 46px; padding: 0 24px; border: 3px solid var(--ink); border-radius: 999px; background: var(--paper); color: var(--ink); font-family: 'Jua', 'Gowun Dodum', sans-serif; font-size: 18px; cursor: pointer; }
.btn.go { background: var(--accent); color: var(--accent-ink); }
.btn.small { min-height: 36px; padding: 0 14px; border-width: 2px; font-family: 'Gowun Dodum', sans-serif; font-size: 15px; }
.btn:disabled { background: var(--off); color: var(--off-ink); border-color: var(--off-line); cursor: not-allowed; }

.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.line { display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 2px dotted var(--dot); }
.line:last-child { border-bottom: none; }
.grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.tag { padding: 1px 10px; border: 2px solid var(--ink); border-radius: 999px; font-size: 14px; white-space: nowrap; }
.empty { padding: 14px 0; color: var(--soft); }
.x { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; border: 2px solid var(--ink); border-radius: 50%; background: var(--paper); cursor: pointer; flex: none; }
.x svg { stroke: var(--ink); }
.cat-row { padding: 10px 0 12px; border-bottom: 2px dotted var(--dot); display: flex; flex-direction: column; gap: 6px; }
.cat-row:last-child { border-bottom: none; }
.cat-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.cat-name { display: flex; align-items: center; gap: 8px; font-family: 'Jua', 'Gowun Dodum', sans-serif; font-size: 18px; }
.notice { margin: 0; padding: 10px 14px; border: 2px dashed var(--dash); border-radius: 14px; background: var(--field); font-size: 15px; }
.placeholder { flex: 1 1 100%; padding: 40px 0; text-align: center; color: var(--soft); }
.piggy-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px; border: 2px dashed var(--dash); border-radius: 16px; background: var(--field); }

/* 달력 */
.cal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.cal-nav { display: flex; align-items: center; gap: 10px; }
.cal-nav h2 { margin: 0; font-family: 'Jua', 'Gowun Dodum', sans-serif; font-weight: 400; font-size: 26px; min-width: 7.5em; text-align: center; }
.nbtn { width: 44px; height: 44px; padding: 0; border: 2px solid var(--ink); border-radius: 50%; background: var(--paper); color: var(--ink); font-family: 'Jua', 'Gowun Dodum', sans-serif; font-size: 20px; cursor: pointer; }
.nbtn:disabled { background: var(--off); color: var(--off-ink); border-color: var(--off-line); cursor: not-allowed; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wd { text-align: center; font-family: 'Jua', 'Gowun Dodum', sans-serif; font-size: 15px; color: var(--soft); }
.day { min-height: 82px; padding: 6px 7px; border: 2px solid var(--dot); border-radius: 12px; background: var(--field); color: var(--ink); display: flex; flex-direction: column; justify-content: space-between; align-items: stretch; text-align: left; cursor: pointer; font-size: 15px; }
.day .n { font-family: 'Jua', 'Gowun Dodum', sans-serif; font-size: 16px; line-height: 1.3; }
.day .n small { font-family: 'Gowun Dodum', sans-serif; font-size: 11px; }
.day .a { font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; min-height: 1.3em; white-space: nowrap; }
.day.has { background: var(--mint); border-color: var(--ink); }
.day.today { border-width: 3px; border-color: var(--ink); }
.day[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.cal-wrap { flex: 1 1 100%; min-width: 0; display: grid; grid-template-columns: minmax(0, 3fr) minmax(240px, 2fr); gap: 28px; align-items: start; }
.cal-main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.cal-side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.day .a small { font-size: 11px; }
.day .a.zero { color: var(--soft); opacity: 0.7; }
.day[aria-pressed="true"] .a.zero { color: var(--paper); }
@media (max-width: 720px) { .cal-wrap { grid-template-columns: minmax(0, 1fr); } }
.lock { display: inline-block; padding: 1px 10px; border: 2px dashed var(--dash); border-radius: 999px; font-size: 13px; color: var(--soft); }

/* 로그인 / 회원가입 */
.auth { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 40px 24px; }
.auth-col { width: 100%; max-width: 480px; }
.auth-tabs { display: flex; align-items: flex-end; gap: 6px; padding-left: 28px; }
.auth-card .inner { display: flex; flex-direction: column; flex-wrap: nowrap; gap: 20px; padding: 34px 32px 30px; }
.auth-head { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.auth-head h1 { margin: 0; font-family: 'Jua', 'Gowun Dodum', sans-serif; font-weight: 400; font-size: 34px; line-height: 1.25; }
.afield { display: flex; flex-direction: column; gap: 6px; }
.afield label { font-family: 'Jua', 'Gowun Dodum', sans-serif; font-size: 18px; }
.afield .field { width: 100%; height: 50px; padding: 0 16px; }
.afield .err { font-size: 14px; }
.btn.wide { min-height: 52px; width: 100%; font-size: 20px; }
.auth-foot { margin: 0; padding-top: 14px; border-top: 2px dotted var(--dot); text-align: center; font-size: 15px; }
.auth-foot button { padding: 0; border: 0; background: none; color: var(--ink); font-size: 15px; font-weight: 700; text-decoration: underline; cursor: pointer; }

/* 정산 창 */
#overlay { position: fixed; inset: 0; z-index: 10; background: var(--veil); display: flex; justify-content: center; align-items: flex-start; overflow: auto;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 12px calc(16px + env(safe-area-inset-bottom, 0px)); }
.dialog { width: 100%; max-width: 640px; padding: 12px; border: 4px solid var(--ink); border-radius: 28px; background: var(--paper); }
.dialog-in { border: 2px dashed var(--dash); border-radius: 18px; padding: 22px 26px 24px; display: flex; flex-direction: column; gap: 16px; }
.dlg-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.dlg-head .left { display: flex; align-items: center; gap: 10px; }
.result { padding: 12px 16px; border: 2px solid var(--ink); border-radius: 16px; background: var(--mint); display: flex; flex-direction: column; gap: 2px; }
.result.bad { border-color: var(--seal); background: var(--field); }
.result .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.result .amt { font-weight: 400; font-family: 'Jua', 'Gowun Dodum', sans-serif; font-size: 30px; font-variant-numeric: tabular-nums; }
.result.bad .amt { color: var(--seal); }
.block { display: flex; flex-direction: column; }
.block .sec-title { margin-bottom: 4px; }
.frow { display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 56px; border-bottom: 2px dotted var(--dot); }
.frow:last-child { border-bottom: none; }
.unit { display: flex; align-items: center; gap: 8px; }
.frow .field { width: 150px; }
.opt .unit .field { width: 150px; }
.calc { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; min-height: 52px; padding-top: 8px; border-bottom: 2px dotted var(--dot); }
.total-box { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0 16px; padding: 10px 16px 12px; border-top: 4px double var(--ink); background: var(--yellow); border-radius: 0 0 14px 14px; }
.total-box.mint { background: var(--mint); }
.total-box .big { font-size: 34px; line-height: 1.3; }
.check { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border: 2px dashed var(--dash); border-radius: 14px; background: var(--field); }
.check .msg { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.opt { padding: 10px 14px; border: 2px solid var(--ink); border-radius: 16px; background: var(--field); }
.opt.on { border-width: 3px; background: var(--yellow); }
.opt label { display: flex; align-items: center; gap: 10px; min-height: 36px; font-family: 'Jua', 'Gowun Dodum', sans-serif; font-size: 18px; cursor: pointer; }
.opt input[type="radio"] { width: 20px; height: 20px; margin: 0; accent-color: var(--ink); }
.opt .more { display: flex; flex-direction: column; gap: 8px; padding: 8px 0 2px 30px; }
fieldset { margin: 0; padding: 0; border: 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
legend { padding: 0; margin-bottom: 8px; font-family: 'Jua', 'Gowun Dodum', sans-serif; font-size: 19px; }
.confirm { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border: 2px solid var(--seal); border-radius: 14px; background: var(--field); }
.add-cat { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border: 2px dashed var(--dash); border-radius: 16px; background: var(--field); }
.add-cat .field { flex: 1 1 200px; background: var(--paper); }
.actions { display: flex; justify-content: flex-end; gap: 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 560px) {
  .inner { padding: 18px 14px; }
  .remain .big { font-size: 40px; }
  .dialog-in { padding: 18px 14px 20px; }
  .frow .field { width: 120px; }
  .tab { padding: 6px 12px 4px; }
  .day { min-height: 58px; padding: 4px 4px; }
  .day .a { font-size: 11px; }
  .day .a small { display: none; }
  .cal-nav h2 { font-size: 21px; min-width: 6.5em; }
}

/* 목업에 없는 화면: 저장 실패 안내와 손상 데이터 복구 */
.save-error { margin: 0; padding: 12px 16px; background: var(--seal); color: var(--paper); text-align: center; }
.recovery { width: calc(100% - 32px); max-width: 560px; margin: 64px auto; word-break: keep-all; }
.recovery .inner { display: block; }
.recovery h1 { margin: 0 0 12px; font-family: 'Jua', 'Gowun Dodum', sans-serif; font-weight: 400; font-size: 28px; line-height: 1.3; }
.recovery p { margin: 0 0 20px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* 목업의 인라인 스타일을 옮긴 것 */
.panel { flex: 1 1 100%; min-width: 0; }
.panel.cols { display: flex; flex-wrap: wrap; gap: 32px; word-break: keep-all; }
.today-total { font-size: 32px; line-height: 1.3; }
.amt-wrap { flex: 1 1 130px; display: flex; align-items: center; gap: 6px; }
.memo-wrap { flex: 2 1 160px; }
.field.full { width: 100%; }
.piggy-amt { font-size: 24px; }
.auth-lead { margin: 0; font-size: 15px; }
.day-total { font-size: 28px; line-height: 1.3; }
.frow.total-row { min-height: 60px; border-bottom: 2px solid var(--ink); }
.frow.total-row .field { width: 170px; }
.frow.tall { min-height: 64px; }
.sec-title.tighter { margin-bottom: 4px; }
.used { display: block; font-family: 'Gowun Dodum', sans-serif; }
.hint { margin: 0; }
.calc.plain { border: none; padding-top: 0; }
.remain .big.preview { font-size: 44px; line-height: 1.2; }
.lock.start { align-self: flex-start; }
.cal-side { word-break: keep-all; }
.entry .entry-title { font-size: 18px; }.sec-title.tight { margin-bottom: 6px; }
.dlg-title { display: flex; align-items: center; gap: 12px; }
.dlg-title h2 { margin: 0; font-family: 'Jua', 'Gowun Dodum', sans-serif; font-weight: 400; font-size: 30px; line-height: 1.25; }
.step { display: flex; flex-direction: column; gap: 16px; }
.alloc-label { font-family: 'Jua', 'Gowun Dodum', sans-serif; font-size: 20px; }
.total-label { font-family: 'Jua', 'Gowun Dodum', sans-serif; font-size: 18px; }
.sum-line { display: flex; justify-content: space-between; align-items: baseline; }
.result.yellow { background: var(--yellow); }
.calc.last { border-bottom: none; }
.over-head { display: flex; align-items: center; gap: 8px; }
.mix-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; }
.opt label.mix-label { font-size: 15px; }
.mix-msg { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.confirm-btns { display: flex; gap: 6px; }
.x:disabled { background: var(--off); border-color: var(--off-line); cursor: not-allowed; }
.add-btn { display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 18px; font-size: 17px; }
#settle-error { margin-top: 6px; }

/* 좁은 화면에서 칩이 세로로 찌그러지거나 금액이 상자 밖으로 나가지 않게 한다. */
.chip { white-space: nowrap; }
.result .top { flex-wrap: wrap; }
.result .amt { margin-left: auto; }
.dlg-title svg { flex: none; }
.dialog-in { word-break: keep-all; }
.cal-head, .head-row { flex-wrap: wrap; }
.day { min-width: 0; overflow: hidden; }
@media (max-width: 560px) {
  .wrap { padding: 24px 8px 40px; }
  .book { padding: 6px; }
  .inner { padding: 14px 8px; }
  .cal-grid { gap: 3px; }
  .cal-nav h2 { min-width: 0; }
  .day { padding: 3px; border-width: 1px; }
  .day .n small { display: none; }
  .day .a { font-size: 10px; line-height: 1.1; white-space: normal; overflow-wrap: anywhere; }
  .line { flex-wrap: wrap; padding: 6px 0; }
  .total-box .big { font-size: 26px; }
  .opt .more { padding-left: 0; }
  .opt .unit .field { width: 120px; }
  .dlg-title h2 { font-size: 24px; }
}
</style>
</head>
<body>
  <p class="save-error" id="save-error" role="alert" hidden>저장하지 못했습니다. 브라우저 저장 공간을 확인한 뒤 다시 시도하세요.</p>

  <div class="auth" id="authview" hidden></div>

  <section class="recovery book" id="recovery" hidden>
    <div class="inner">
      <h1>저장된 데이터를 읽을 수 없습니다</h1>
      <p>데이터가 손상되었거나 지원하지 않는 형식입니다. 저장된 원본은 지우지 않았습니다.</p>
      <button class="btn" id="reset-start" type="button">데이터 초기화</button>
      <div id="reset-confirm" role="alert" hidden>
        <p>모든 데이터가 삭제되고 되돌릴 수 없습니다.</p>
        <div class="btn-row">
          <button class="btn go" id="reset-run" type="button">모두 삭제하고 새로 시작</button>
          <button class="btn" id="reset-cancel" type="button">취소</button>
        </div>
      </div>
    </div>
  </section>

  <div class="wrap" id="app" hidden>
    <nav class="tabs" aria-label="메뉴">
      <button class="tab" type="button" data-view="dashboard" aria-current="page">대시보드</button>
      <button class="tab" type="button" data-view="calendar">달력</button>
      <button class="tab" type="button" data-view="settings">설정</button>
      <span class="date" id="today-label"></span>
    </nav>
    <main class="book">
      <div class="inner">
        <section class="panel cols" data-panel="dashboard"></section>
        <section class="panel" data-panel="calendar" hidden></section>
        <section class="panel cols" data-panel="settings" hidden></section>
      </div>
    </main>
  </div>

  <div id="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-label="매달 첫 정산">
      <form class="dialog-in" id="settle-form" novalidate>
        <div class="dlg-head"><span class="chip" id="settle-step"></span><span class="sub" id="settle-label"></span></div>
        <div class="dlg-title">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script>
'use strict';

// ---- 상수 ----

// 공개용 키라서 저장소에 둔다. 사용자별 접근 제한은 Row Level Security가 맡는다.
const SUPABASE_URL = 'https://kqqveotykeuyffrlhrxm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1XpOuFjG5GUXEROTHBHaAQ_j9iU3hwD';
const STORAGE_KEY = 'living-budget';
const EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const PASSWORD_MIN = 8;
const DATA_VERSION = 1;
const DEFAULT_CATEGORIES = ['식비', '의류', '취미', '교통', '기타'];
const CATEGORY_NAME_MAX = 10;
const WEEKDAYS = ['월', '화', '수', '목', '금', '토', '일'];

// ---- 금액 유틸 ----

// 원 단위 정수만 받는다. 쉼표는 천 단위 위치에만 허용한다.
function parseAmount(text, { min = 0 } = {}) {
  const raw = String(text ?? '').trim();
  if (raw === '') return { ok: false, error: '금액을 입력하세요.' };
  if (raw.startsWith('-')) return { ok: false, error: '음수는 입력할 수 없습니다.' };
  if (raw.includes('.')) return { ok: false, error: '소수점 없이 원 단위로 입력하세요.' };
  if (!/^(\d+|\d{1,3}(,\d{3})+)$/.test(raw)) return { ok: false, error: '숫자만 입력하세요.' };

  const value = Number(raw.replaceAll(',', ''));
  if (!Number.isSafeInteger(value)) return { ok: false, error: '금액이 너무 큽니다.' };
  if (value < min) return { ok: false, error: `${formatWon(min)} 이상 입력하세요.` };
  return { ok: true, value };
}

// 빈칸을 0원으로 보는 입력칸(분류 배분)에서 쓴다.
function parseOptionalAmount(text) {
  return String(text ?? '').trim() === '' ? { ok: true, value: 0 } : parseAmount(text);
}

function formatWon(amount) {
  return `${(amount || 0).toLocaleString('ko-KR')}원`;
}

function formatSigned(amount) {
  return amount > 0 ? `+${formatWon(amount)}` : formatWon(amount);
}

// ---- 날짜 유틸 ----

// 날짜는 'YYYY-MM-DD', 달은 'YYYY-MM' 문자열로 다룬다.
// toISOString은 UTC로 바뀌어 한국 시간 오전에 날짜가 밀리므로 쓰지 않는다.
function pad2(number) {
  return String(number).padStart(2, '0');
}

function toDateKey(date) {
  return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
}

// 오늘 날짜를 얻는 유일한 함수. 월 전환 테스트는 이 함수만 바꾼다.
function getToday() {
  return toDateKey(new Date());
}

function monthKeyOf(dateKey) {
  return dateKey.slice(0, 7);
}

function addMonths(monthKey, delta) {
  const [year, month] = monthKey.split('-').map(Number);
  const date = new Date(year, month - 1 + delta, 1);
  return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}`;
}

function daysInMonth(monthKey) {
  const [year, month] = monthKey.split('-').map(Number);
  return new Date(year, month, 0).getDate();
}

function monthDates(monthKey) {
  return Array.from({ length: daysInMonth(monthKey) }, (_, i) => `${monthKey}-${pad2(i + 1)}`);
}

// 월요일 0 ~ 일요일 6
function weekdayIndex(dateKey) {
  const [year, month, day] = dateKey.split('-').map(Number);
  return (new Date(year, month - 1, day).getDay() + 6) % 7;
}

// 월~일 단위로 묶는다. 달 경계에 걸친 주에는 해당 달 날짜만 담는다.
function weeksOfMonth(monthKey) {
  const weeks = [];
  for (const dateKey of monthDates(monthKey)) {
    if (weeks.length === 0 || weekdayIndex(dateKey) === 0) weeks.push([]);
    weeks.at(-1).push(dateKey);
  }
  return weeks;
}

function isLockedDate(dateKey) {
  return monthKeyOf(dateKey) < monthKeyOf(getToday());
}

function formatDate(dateKey) {
  const [year, month, day] = dateKey.split('-').map(Number);
  return `${year}년 ${month}월 ${day}일 (${WEEKDAYS[weekdayIndex(dateKey)]})`;
}

function formatDay(dateKey) {
  const [, month, day] = dateKey.split('-').map(Number);
  return `${month}월 ${day}일 (${WEEKDAYS[weekdayIndex(dateKey)]})`;
}

function formatMonth(monthKey) {
  const [year, month] = monthKey.split('-').map(Number);
  return `${year}년 ${month}월`;
}

// ---- 저장소 ----

let state = null;
let currentUser = null;

// 계정마다 따로 저장한다. T9에서 DB로 바꾸면 이 키는 쓰지 않는다.
function dataKey(userId) {
  return `${STORAGE_KEY}:${userId}`;
}

function createId(prefix) {
  return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
}

function createEmptyData() {
  return {
    version: DATA_VERSION,
    categories: DEFAULT_CATEGORIES.map((name) => ({ id: createId('cat'), name, hidden: false })),
    months: {},
    expenses: [],
    piggy: { balance: 0, history: [] },
    unsettled: [],
  };
}

function isPlainObject(value) {
  return typeof value === 'object' && value !== null && !Array.isArray(value);
}

function isValidCategory(category) {
  return isPlainObject(category)
    && typeof category.id === 'string'
    && typeof category.name === 'string'
    && typeof category.hidden === 'boolean';
}

function isValidData(data) {
  return isPlainObject(data)
    && data.version === DATA_VERSION
    && Array.isArray(data.categories)
    && data.categories.every(isValidCategory)
    && isPlainObject(data.months)
    && Array.isArray(data.expenses)
    && isPlainObject(data.piggy)
    && Number.isSafeInteger(data.piggy.balance)
    && Array.isArray(data.piggy.history)
    && Array.isArray(data.unsettled);
}

// 손상된 값은 읽기만 하고 덮어쓰지 않는다. 지우는 것은 사용자가 고른다.
function loadData(userId) {
  let raw = null;
  try {
    raw = localStorage.getItem(dataKey(userId));
  } catch {
    return { status: 'empty', data: createEmptyData() };
  }
  if (raw === null) return { status: 'empty', data: createEmptyData() };

  try {
    const data = JSON.parse(raw);
    return isValidData(data) ? { status: 'ok', data } : { status: 'corrupt' };
  } catch {
    return { status: 'corrupt' };
  }
}

function saveData(userId, data) {
  try {
    localStorage.setItem(dataKey(userId), JSON.stringify(data));
    return true;
  } catch {
    return false;
  }
}

function saveState() {
  document.getElementById('save-error').hidden = saveData(currentUser, state);
}

// ---- 정산 ----

function needsSettlement(data, monthKey) {
  return data.months[monthKey]?.settled !== true;
}

function lastSettledMonth(data, monthKey) {
  const settled = Object.keys(data.months)
    .filter((key) => key < monthKey && data.months[key].settled === true);
  return settled.sort().at(-1) ?? null;
}

function monthSpent(data, monthKey) {
  return data.expenses
    .filter((expense) => monthKeyOf(expense.date) === monthKey)
    .reduce((sum, expense) => sum + expense.amount, 0);
}

function monthBalance(data, monthKey) {
  return data.months[monthKey].total - monthSpent(data, monthKey);
}

function computeTotal(baseAmount, carryIn, deduction) {
  return baseAmount + carryIn - deduction;
}

// 마지막으로 정산된 달의 결과로 1단계 화면 종류를 정한다.
function settlementContext(data, monthKey) {
  const lastMonth = lastSettledMonth(data, monthKey);
  const piggyBalance = data.piggy.balance;
  if (lastMonth === null) return { mode: 'first', lastMonth, amount: 0, piggyBalance };
  const balance = monthBalance(data, lastMonth);
  if (balance > 0) return { mode: 'leftover', lastMonth, amount: balance, piggyBalance };
  if (balance < 0) return { mode: 'over', lastMonth, amount: -balance, piggyBalance };
  return { mode: 'even', lastMonth, amount: 0, piggyBalance };
}

// 저금통에서 뺄 수 있는 한도
function piggyCap({ amount, piggyBalance }) {
  return Math.min(piggyBalance, amount);
}

// 1단계 입력값으로 총 금액을 계산한다. why는 `다음`을 막는 이유이고 비어 있으면 통과다.
function calcSettlement({ mode, amount, piggyBalance }, { base: baseText, save: saveText, carry: carryText, option, piggy: piggyText }) {
  const empty = String(baseText ?? '').trim() === '';
  const parsed = parseAmount(baseText);
  const base = parsed.ok ? parsed.value : null;
  let carryIn = 0;
  let piggyIn = 0;
  let piggyOut = 0;
  let deduction = 0;
  let choiceWhy = '';
  if (mode === 'over' && option === 'next') deduction = amount;
  if (mode === 'over' && option === 'mix') {
    const piggy = parseOptionalAmount(piggyText);
    if (!piggy.ok) {
      choiceWhy = 'bad';
    } else {
      piggyOut = piggy.value;
      deduction = Math.max(amount - piggy.value, 0);
      if (piggy.value > piggyCap({ amount, piggyBalance })) choiceWhy = 'cap';
    }
  }
  if (mode === 'leftover') {
    const save = parseOptionalAmount(saveText);
    const carry = parseOptionalAmount(carryText);
    if (!save.ok || !carry.ok) {
      choiceWhy = 'bad';
    } else {
      carryIn = carry.value;
      piggyIn = save.value;
      if (save.value + carry.value !== amount) choiceWhy = 'sum';
    }
  }
  const total = computeTotal(base ?? 0, carryIn, deduction);
  let why = '';
  if (!empty && base === null) why = 'base';
  else if (choiceWhy !== '') why = choiceWhy;
  else if (empty) why = 'empty';
  else if (total < 1) why = 'total';
  return { base, carryIn, deduction, piggyIn, piggyOut, total, why, ok: why === '' };
}

// 분류 이름의 오류 문구를 돌려준다. 문제가 없으면 빈 문자열이다.
function categoryNameError(name, categories) {
  const trimmed = name.trim();
  if (trimmed === '') return '분류 이름을 입력해 주세요.';
  if (trimmed.length > CATEGORY_NAME_MAX) return `분류 이름은 ${CATEGORY_NAME_MAX}자 이하로 입력해 주세요.`;
  if (categories.some((category) => category.name === trimmed)) return '이미 있는 분류예요.';
  return '';
}

// 정산에서 정한 목록을 반영한다. 목록에서 빠진 분류는 지출 내역이 있으면 지난 기록을 위해 숨기기만 한다.
function applyCategories(data, drafts) {
  const kept = new Set(drafts.map(({ id }) => id));
  const known = new Set(data.categories.map(({ id }) => id));
  const used = new Set(data.expenses.map((expense) => expense.categoryId));
  const existing = data.categories
    .filter((category) => kept.has(category.id) || used.has(category.id))
    .map((category) => ({ ...category, hidden: !kept.has(category.id) }));
  const added = drafts
    .filter(({ id }) => !known.has(id))
    .map(({ id, name }) => ({ id, name, hidden: false }));
  data.categories = [...existing, ...added];
}

// 건너뛴 달은 지출 0원, 총 금액 미설정으로 마감한다. settled가 아니므로 다음 정산의 기준이 되지 않는다.
function closeSkippedMonths(data, lastMonth, monthKey) {
  if (lastMonth === null) return;
  for (let key = addMonths(lastMonth, 1); key < monthKey; key = addMonths(key, 1)) {
    data.months[key] ??= { baseAmount: 0, carryIn: 0, deduction: 0, total: null, allocations: {}, settled: false, skipped: true };
  }
}

function addPiggyHistory(data, type, amount, memo) {
  data.piggy.balance += type === 'save' ? amount : -amount;
  data.piggy.history.push({ id: createId('piggy'), date: getToday(), type, amount, memo });
}

// 정산 결과는 이 함수에서 한 번에 기록한다. 저금통은 여기서만 변한다.
function applySettlement(data, monthKey, settlement) {
  const { baseAmount, carryIn, deduction, total, allocations, categories } = settlement;
  const { piggyIn = 0, piggyOut = 0, kept = 0, lastMonth = null } = settlement;
  const label = lastMonth === null ? '' : `${Number(lastMonth.slice(5))}월`;
  applyCategories(data, categories);
  if (piggyIn > 0) addPiggyHistory(data, 'save', piggyIn, `${label} 남은 돈 저축`);
  if (piggyOut > 0) addPiggyHistory(data, 'deficit', piggyOut, `${label} 초과분 차감`);
  if (kept > 0) data.unsettled.push({ month: lastMonth, amount: kept });
  closeSkippedMonths(data, lastMonth, monthKey);
  data.months[monthKey] = { baseAmount, carryIn, deduction, total, allocations, settled: true };
}

// 분류별 입력값을 더해 아직 나누지 않은 금액을 계산한다. 잘못된 칸은 합계에서 뺀다.
function allocationSummary(categories, texts, total) {
  let sum = 0;
  let bad = false;
  for (const { id } of categories) {
    const parsed = parseOptionalAmount(texts[id]);
    if (parsed.ok) sum += parsed.value;
    else bad = true;
  }
  const left = total - sum;
  return { sum, bad, left, ok: !bad && left === 0 };
}

// ---- 지출 ----

function visibleCategories(data) {
  return data.categories.filter((category) => !category.hidden);
}

function categoryName(data, id) {
  return data.categories.find((category) => category.id === id)?.name ?? '삭제된 분류';
}

// 지출 입력의 오류 문구를 돌려준다. 문제가 없으면 빈 문자열이다.
function expenseError(categoryId, amountText) {
  if (!categoryId) return '분류를 먼저 골라 주세요.';
  const parsed = parseAmount(amountText);
  if (!parsed.ok) return '금액은 원 단위 숫자만 입력할 수 있어요.';
  return parsed.value < 1 ? '1원 이상 입력해 주세요.' : '';
}

// 이번 달이면서 오늘까지인 날짜만 지출을 바꿀 수 있다.
function canEditDate(dateKey) {
  return dateKey <= getToday() && !isLockedDate(dateKey);
}

// 대시보드는 오늘 날짜로, 달력은 고른 날짜로 부른다. 바꿀 수 없는 날짜면 false를 돌려준다.
function addExpense(data, { date, categoryId, amount, memo }) {
  if (!canEditDate(date)) return false;
  data.expenses.push({ id: createId('exp'), date, categoryId, amount, memo });
  return true;
}

function deleteExpense(data, id) {
  const target = data.expenses.find((expense) => expense.id === id);
  if (target === undefined || !canEditDate(target.date)) return false;
  data.expenses = data.expenses.filter((expense) => expense.id !== id);
  return true;
}

function updateExpense(data, id, { categoryId, amount, memo }) {
  const target = data.expenses.find((expense) => expense.id === id);
  if (target === undefined || !canEditDate(target.date)) return false;
  Object.assign(target, { categoryId, amount, memo });
  return true;
}

function daySpent(data, dateKey) {
  return data.expenses
    .filter((expense) => expense.date === dateKey)
    .reduce((sum, expense) => sum + expense.amount, 0);
}

// 그 달의 날짜별 지출 합계
function dayTotals(data, monthKey) {
  const totals = {};
  for (const { date, amount } of data.expenses) {
    if (monthKeyOf(date) === monthKey) totals[date] = (totals[date] ?? 0) + amount;
  }
  return totals;
}

// 달력에서 갈 수 있는 가장 이른 달. 지출이나 정산 기록이 있는 달까지 간다.
function earliestMonth(data, currentMonth) {
  const months = [...data.expenses.map(({ date }) => monthKeyOf(date)), ...Object.keys(data.months), currentMonth];
  return months.sort()[0];
}

// 분류별 지출과 전체 지출을 합친다. 그 달 날짜의 지출만 더한다.
function monthSummary(data, monthKey) {
  const byCategory = {};
  let spent = 0;
  for (const { date, categoryId, amount } of data.expenses) {
    if (monthKeyOf(date) !== monthKey) continue;
    byCategory[categoryId] = (byCategory[categoryId] ?? 0) + amount;
    spent += amount;
  }
  return { spent, byCategory };
}

// 막대에 쓸 사용 비율. 100%를 넘어도 막대는 100%까지만 채운다.
function usedPercent(used, budget) {
  if (budget <= 0) return used > 0 ? 100 : 0;
  return Math.min(100, Math.round((used / budget) * 100));
}

// 설정 입력값을 판단한다. ok일 때만 저장할 수 있다.
function settingsState(categories, month, { total: totalText, allocations: texts }) {
  const parsed = parseAmount(totalText);
  const total = parsed.ok ? parsed.value : null;
  const totalBad = total === null || total < 1;
  const allocations = {};
  let sum = 0;
  let bad = false;
  let changed = total !== null && total !== month.total;
  for (const { id } of categories) {
    const amount = parseOptionalAmount(texts[id]);
    if (!amount.ok) {
      bad = true;
      continue;
    }
    sum += amount.value;
    allocations[id] = amount.value;
    if (amount.value !== (month.allocations[id] ?? 0)) changed = true;
  }
  const left = (total ?? 0) - sum;
  return { total, totalBad, bad, left, changed, allocations, ok: !totalBad && !bad && left === 0 && changed };
}

function settingsHint({ total, bad, left, changed }) {
  if (total === null) return '총 금액은 원 단위 숫자만 입력할 수 있어요.';
  if (total < 1) return '총 금액은 1원 이상이어야 해요.';
  if (bad) return '금액은 원 단위 숫자만 입력할 수 있어요.';
  if (left > 0) return `${formatWon(left)}을 더 나눠야 저장할 수 있어요.`;
  if (left < 0) return `총 금액보다 ${formatWon(-left)} 많아요. 줄여 주세요.`;
  if (!changed) return '바꾼 내용이 없어요.';
  return '합계가 딱 맞아요. 저장할 수 있어요.';
}

// 이월과 차감은 지난달 결과이므로 그대로 두고, 공식이 맞도록 기본 금액을 맞춘다.
function applyMonthEdit(data, monthKey, total, allocations) {
  const month = data.months[monthKey];
  month.total = total;
  month.allocations = allocations;
  month.baseAmount = total - month.carryIn + month.deduction;
}

// ---- 정산 창 ----

// 입력 중인 값은 저장하지 않는다. 끝나기 전에 새로고침하면 창이 처음부터 다시 뜬다.
let settle = null;

const ICON_X = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3 L13 13 M13 3 L3 13" stroke-width="2.5" stroke-linecap="round" fill="none"></path></svg>';
const ICON_NO = '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="8" fill="#FFF1A8" stroke="#2B4A22" stroke-width="2"></circle><path d="M9 4.5 V10 M9 12.5 V13.5" stroke="#2B4A22" stroke-width="2.2" stroke-linecap="round" fill="none"></path></svg>';

function escapeHtml(text) {
  const entities = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  return String(text).replace(/[&<>"']/g, (char) => entities[char]);
}

function currentCalc() {
  return calcSettlement(settle.context, settle.inputs);
}

function settleErrorText({ why }) {
  if (why === 'base') return '기본 금액은 원 단위 숫자만 입력할 수 있어요.';
  if (why === 'total') return '이번 달 총 금액은 1원 이상이어야 해요.';
  if (why === 'bad' && settle.context.mode === 'leftover') return '금액은 원 단위 숫자만 입력할 수 있어요.';
  if (why === 'sum') return `저축과 이월을 더한 금액이 남은 ${formatWon(settle.context.amount)}과 같아야 해요.`;
  return '';
}

function markInvalid(input, invalid) {
  if (invalid) input.setAttribute('aria-invalid', 'true');
  else input.removeAttribute('aria-invalid');
}

// 지난달 결과 부분은 정산 창을 열 때 한 번만 채운다.
function renderLastMonth() {
  const { mode, lastMonth, amount, piggyBalance } = settle.context;
  const leftover = mode === 'leftover';
  const over = mode === 'over';
  document.getElementById('first-notice').hidden = mode !== 'first';
  document.getElementById('left-result').hidden = !leftover;
  document.getElementById('left-choice').hidden = !leftover;
  document.getElementById('over-result').hidden = !over;
  document.getElementById('over-choice').hidden = !over;
  if (leftover) {
    document.getElementById('left-label').textContent = `${Number(lastMonth.slice(5))}월 남은 돈`;
    document.getElementById('left-amount').textContent = `+${formatWon(amount)}`;
    document.getElementById('left-title').textContent = `남은 ${formatWon(amount)}을 어떻게 할까요?`;
  }
  if (over) {
    document.getElementById('over-label').textContent = `${Number(lastMonth.slice(5))}월 초과 지출`;
    document.getElementById('over-amount').textContent = formatWon(-amount);
    document.getElementById('over-title').textContent = `초과한 ${formatWon(amount)}을 어떻게 할까요?`;
    document.getElementById('piggy-label').textContent = `저금통에서 뺄 금액 (잔액 ${formatWon(piggyBalance)})`;
  }
}

function renderOverChoice({ why }) {
  const { option, piggy } = settle.inputs;
  for (const key of ['next', 'keep', 'mix']) {
    document.getElementById(`opt-${key}`).classList.toggle('on', option === key);
  }
  document.getElementById('mix-more').hidden = option !== 'mix';
  const message = document.getElementById('mix-msg');
  if (why === 'bad') message.innerHTML = `${ICON_NO}금액은 원 단위 숫자만 입력해요`;
  else if (why === 'cap') message.innerHTML = `${ICON_NO}${formatWon(piggyCap(settle.context))}까지만 뺄 수 있어요`;
  else message.innerHTML = '';
  markInvalid(document.getElementById('piggy-amount'), !parseOptionalAmount(piggy).ok || why === 'cap');
}

function renderTotal() {
  const calc = currentCalc();
  const error = document.getElementById('settle-error');
  const base = document.getElementById('base-amount');
  const message = settleErrorText(calc);
  document.getElementById('calc-carry').textContent = `+ ${formatWon(calc.carryIn)}`;
  document.getElementById('calc-deduction').textContent = `- ${formatWon(calc.deduction)}`;
  document.getElementById('calc-total').textContent = formatWon(calc.total);
  error.textContent = message;
  error.hidden = message === '';
  markInvalid(base, calc.why === 'base');
  markInvalid(document.getElementById('save-amount'), !parseOptionalAmount(settle.inputs.save).ok);
  markInvalid(document.getElementById('carry-amount'), !parseOptionalAmount(settle.inputs.carry).ok);
  if (settle.context.mode === 'over') renderOverChoice(calc);
  document.getElementById('settle-next').disabled = !calc.ok;
}

function allocationRow({ id, name }) {
  const safeId = escapeHtml(id);
  const safeName = escapeHtml(name);
  if (settle.confirmId === id) {
    return `<div class="confirm" role="alert">
      <span>${safeName} 분류를 삭제할까요? 이번 달부터 목록에서 빠져요.</span>
      <span class="confirm-btns">
        <button class="btn small" type="button" data-act="del-yes" data-id="${safeId}">삭제</button>
        <button class="btn small" type="button" data-act="del-no" data-id="${safeId}">취소</button>
      </span>
    </div>`;
  }
  const lastOne = settle.categories.length <= 1 ? ' disabled' : '';
  return `<div class="frow">
    <label class="alloc-label" for="alloc-${safeId}">${safeName}</label>
    <div class="unit">
      <input class="field right" id="alloc-${safeId}" data-alloc="${safeId}" inputmode="numeric" autocomplete="off" placeholder="0" value="${escapeHtml(settle.allocations[id] ?? '')}"><span>원</span>
      <button class="x" type="button" data-act="del-ask" data-id="${safeId}" aria-label="${safeName} 분류 삭제"${lastOne}>${ICON_X}</button>
    </div>
  </div>`;
}

// 입력칸을 다시 그리지 않으므로 입력 중에 불러도 포커스가 유지된다.
function renderAllocateSummary() {
  const { sum, bad, left, ok } = allocationSummary(settle.categories, settle.allocations, currentCalc().total);
  const leftEl = document.getElementById('alloc-left');
  const hint = document.getElementById('alloc-hint');
  document.getElementById('alloc-sum').textContent = formatWon(sum);
  leftEl.textContent = formatWon(left);
  leftEl.classList.toggle('neg-text', left < 0);
  hint.textContent = bad ? '금액은 원 단위 숫자만 입력할 수 있어요.' : '';
  hint.hidden = !bad;
  document.getElementById('settle-next').disabled = !ok;
  document.querySelectorAll('[data-alloc]').forEach((input) => {
    markInvalid(input, !parseOptionalAmount(input.value).ok);
  });
}

function renderAllocateStep() {
  document.getElementById('alloc-total').textContent = formatWon(currentCalc().total);
  document.getElementById('alloc-rows').innerHTML = settle.categories.map(allocationRow).join('');
  renderAllocateSummary();
}

function handleAllocationInput(event) {
  const id = event.target.dataset.alloc;
  if (id === undefined) return;
  settle.allocations[id] = event.target.value;
  renderAllocateSummary();
}

function showCategoryError(message) {
  const error = document.getElementById('cat-error');
  error.textContent = message;
  error.hidden = message === '';
}

function addCategory() {
  const input = document.getElementById('new-cat');
  const message = categoryNameError(input.value, settle.categories);
  showCategoryError(message);
  if (message === '') {
    settle.categories.push({ id: createId('cat'), name: input.value.trim() });
    input.value = '';
    renderAllocateStep();
  }
  input.focus();
}

function removeCategory(id) {
  if (settle.categories.length <= 1) return;
  settle.categories = settle.categories.filter((category) => category.id !== id);
  delete settle.allocations[id];
  settle.confirmId = null;
  showCategoryError('');
  renderAllocateStep();
  document.getElementById('new-cat').focus();
}

function handleCategoryClick(event) {
  const button = event.target.closest('[data-act]');
  if (button === null) return;
  const { act, id } = button.dataset;
  if (act === 'add-cat') addCategory();
  if (act === 'del-yes') removeCategory(id);
  if (act === 'del-ask' || act === 'del-no') {
    settle.confirmId = act === 'del-ask' ? id : null;
    renderAllocateStep();
    const next = act === 'del-ask' ? '[data-act="del-no"]' : `[data-act="del-ask"][data-id="${CSS.escape(id)}"]`;
    document.querySelector(next).focus();
  }
}

function saveSettle() {
  const { monthKey, categories, allocations, context, inputs } = settle;
  const { base, carryIn, deduction, piggyIn, piggyOut, total } = currentCalc();
  if (!allocationSummary(categories, allocations, total).ok) return;
  applySettlement(state, monthKey, {
    baseAmount: base,
    carryIn,
    deduction,
    total,
    piggyIn,
    piggyOut,
    kept: context.mode === 'over' && inputs.option === 'keep' ? context.amount : 0,
    lastMonth: context.lastMonth,
    allocations: Object.fromEntries(categories.map(({ id }) => [id, parseOptionalAmount(allocations[id]).value])),
    categories,
  });
  settle = null;
  saveState();
  enterApp();
  showView('dashboard');
}

function renderSettle() {
  const { monthKey, step } = settle;
  const title = document.getElementById('settle-title');
  const firstTitle = settle.context.mode === 'over' ? '지난달 정리하고 이번 달 정해요' : '';
  const titleText = step === 2 ? '분류별로 나눠 주세요' : firstTitle;
  document.getElementById('settle-step').textContent = `${step} / 2 단계`;
  document.getElementById('settle-label').textContent = `${Number(monthKey.slice(5))}월 첫 정산`;
  title.textContent = titleText;
  title.hidden = titleText === '';
  document.querySelectorAll('[data-step]').forEach((panel) => {
    panel.hidden = Number(panel.dataset.step) !== step;
  });
  document.getElementById('settle-back').hidden = step === 1;
  document.getElementById('settle-next').textContent = step === 2 ? '저장하고 시작' : '다음';
  if (step === 1) renderTotal();
  else renderAllocateStep();
  const inputs = document.querySelectorAll(`[data-step="${step}"] input`);
  [...inputs].find((input) => input.offsetParent !== null && (input.type !== 'radio' || input.checked))?.focus();
}

function startSettle(monthKey) {
  settle = {
    monthKey,
    step: 1,
    context: settlementContext(state, monthKey),
    inputs: { base: '', save: '', carry: '', option: 'next', piggy: '' },
    categories: visibleCategories(state).map(({ id, name }) => ({ id, name })),
    allocations: {},
    confirmId: null,
  };
  document.getElementById('settle-form').reset();
  showCategoryError('');
  renderLastMonth();
  renderSettle();
}

function moveSettle(step) {
  settle.step = step;
  renderSettle();
}

function handleSettleInput(event) {
  const { field } = event.target.dataset;
  if (field === undefined) return;
  settle.inputs[field] = event.target.value;
  renderTotal();
}

function handleSettleSubmit(event) {
  event.preventDefault();
  if (settle.step === 2) saveSettle();
  else if (currentCalc().ok) moveSettle(2);
}

// ---- 대시보드 ----

const dashboard = { categoryId: '', error: '' };

function categoryChips(categories, selectedId, act = 'pick-category') {
  return categories.map(({ id, name }) => `<button class="pill" type="button" data-act="${act}" data-id="${escapeHtml(id)}" aria-pressed="${id === selectedId}">${escapeHtml(name)}</button>`).join('');
}

function todayRows(today) {
  const rows = state.expenses.filter((expense) => expense.date === today).map(({ id, categoryId, amount, memo }) => {
    const label = escapeHtml(memo || '지출');
    return `<li class="line"><span class="tag">${escapeHtml(categoryName(state, categoryId))}</span><span class="grow">${escapeHtml(memo || '메모 없음')}</span><span class="tnum">${formatWon(amount)}</span><button class="x" type="button" data-act="delete-expense" data-id="${escapeHtml(id)}" aria-label="${label} 삭제">${ICON_X}</button></li>`;
  }).join('');
  return rows || '<li class="empty">오늘 쓴 돈이 아직 없어요.</li>';
}

function categoryRow({ id, name }, allocations, byCategory) {
  const budget = allocations[id] ?? 0;
  const used = byCategory[id] ?? 0;
  const left = budget - used;
  const over = left < 0;
  return `<div class="cat-row">
    <div class="cat-top"><span class="cat-name">${escapeHtml(name)}${over ? ' <span class="over-pill">초과</span>' : ''}</span><strong class="tnum${over ? ' neg-text' : ''}">${formatWon(left)}</strong></div>
    <div class="bar${over ? ' over' : ''}"><i style="width:${usedPercent(used, budget)}%"></i></div>
    <span class="sub">배분 ${formatWon(budget)} · 사용 ${formatWon(used)}</span>
  </div>`;
}

function monthColumn(monthKey, categories) {
  const { total, allocations } = state.months[monthKey];
  const { spent, byCategory } = monthSummary(state, monthKey);
  const remain = total - spent;
  const percent = usedPercent(spent, total);
  return `<div class="col">
    <div class="remain">
      <span class="chip">이번 달 남은 돈</span>
      <strong class="big${remain < 0 ? ' neg' : ''}" id="month-remain">${formatWon(remain)}</strong>
      <div class="bar lg${remain < 0 ? ' over' : ''}"><i style="width:${percent}%"></i></div>
      <div class="meta"><span>총 ${formatWon(total)} 중 ${formatWon(spent)} 사용</span><span>${percent}% 썼어요</span></div>
    </div>
    <div class="piggy-row"><span class="chip">저금통 잔액</span><strong class="big piggy-amt" id="piggy-balance">${formatWon(state.piggy.balance)}</strong></div>
    <div><p class="sec-title tight">분류별 남은 돈</p>${categories.map((category) => categoryRow(category, allocations, byCategory)).join('')}</div>
  </div>`;
}

// 다시 그려도 입력 중인 금액과 메모는 남긴다.
function renderDashboard() {
  const today = getToday();
  const monthKey = monthKeyOf(today);
  if (needsSettlement(state, monthKey)) return;
  const categories = visibleCategories(state);
  if (!categories.some(({ id }) => id === dashboard.categoryId)) dashboard.categoryId = categories[0]?.id ?? '';
  const amount = document.getElementById('in-amt')?.value ?? '';
  const memo = document.getElementById('in-memo')?.value ?? '';
  const invalid = dashboard.error ? ' aria-invalid="true"' : '';
  document.querySelector('[data-panel="dashboard"]').innerHTML = `<div class="col">
    <div class="head-row"><span class="chip">오늘 쓴 돈</span><strong class="big today-total" id="today-spent">${formatWon(daySpent(state, today))}</strong></div>
    <div class="entry">
      <h2>오늘 지출 입력</h2>
      <div class="pills" role="group" aria-label="분류">${categoryChips(categories, dashboard.categoryId)}</div>
      <div class="fields">
        <div class="amt-wrap"><label class="sr" for="in-amt">금액</label><input class="field right full" id="in-amt" inputmode="numeric" placeholder="금액" autocomplete="off" value="${escapeHtml(amount)}"${invalid}><span>원</span></div>
        <div class="memo-wrap"><label class="sr" for="in-memo">메모</label><input class="field full" id="in-memo" maxlength="30" placeholder="메모 (예: 점심)" autocomplete="off" value="${escapeHtml(memo)}"></div>
        <button class="btn go" type="button" data-act="add-expense">추가</button>
      </div>
      <p class="err" id="in-err" role="alert"${dashboard.error ? '' : ' hidden'}>${escapeHtml(dashboard.error)}</p>
    </div>
    <ul class="list" aria-label="오늘 쓴 내역">${todayRows(today)}</ul>
  </div>${monthColumn(monthKey, categories)}`;
}

function submitExpense() {
  const amountInput = document.getElementById('in-amt');
  const memoInput = document.getElementById('in-memo');
  dashboard.error = expenseError(dashboard.categoryId, amountInput.value);
  if (dashboard.error === '') {
    addExpense(state, {
      date: getToday(),
      categoryId: dashboard.categoryId,
      amount: parseAmount(amountInput.value).value,
      memo: memoInput.value.trim(),
    });
    amountInput.value = '';
    memoInput.value = '';
    saveState();
  }
  renderDashboard();
  document.getElementById('in-amt').focus();
}

// 탭을 열어둔 채 달이 바뀌었으면 입력을 받지 않고 정산 창을 띄운다.
function blockedByNewMonth() {
  if (!needsSettlement(state, monthKeyOf(getToday()))) return false;
  enterApp();
  return true;
}

function handleDashboardClick(event) {
  const button = event.target.closest('[data-act]');
  if (button === null || blockedByNewMonth()) return;
  const { act, id } = button.dataset;
  if (act === 'add-expense') submitExpense();
  if (act === 'pick-category') {
    dashboard.categoryId = id;
    dashboard.error = '';
    renderDashboard();
  }
  if (act === 'delete-expense') {
    deleteExpense(state, id);
    saveState();
    renderDashboard();
    document.getElementById('in-amt').focus();
  }
}

function handleDashboardKeydown(event) {
  if (event.key !== 'Enter' || !['in-amt', 'in-memo'].includes(event.target.id)) return;
  event.preventDefault();
  if (!blockedByNewMonth()) submitExpense();
}

// ---- 달력 ----

const calendar = { month: '', selected: null, editId: null, editCategory: '', addCategory: '' };

const ICON_EDIT = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13 L3.6 10.4 L11.2 2.8 L13.2 4.8 L5.6 12.4 Z" stroke-width="2" stroke-linejoin="round" fill="none"></path></svg>';

function dayCell(dateKey, amount, today) {
  const day = Number(dateKey.slice(8));
  const isToday = dateKey === today;
  const classes = ['day', amount > 0 ? 'has' : '', isToday ? 'today' : ''].filter(Boolean).join(' ');

  const shown = amount > 0
    ? `<span class="a">${amount.toLocaleString('ko-KR')}<small>원</small></span>`
    : '<span class="a zero">0</span>';
  return `<button class="${classes}" type="button" data-act="cal-day" data-date="${dateKey}" aria-pressed="${calendar.selected === dateKey}" aria-label="${label}"><span class="n">${day}${isToday ? '<small> 오늘</small>' : ''}</span>${shown}</button>`;
}

function editBox({ amount, memo }) {
  return `<li class="entry">
    <p class="sec-title entry-title">지출 수정</p>
    <div class="pills" role="group" aria-label="분류">${categoryChips(visibleCategories(state), calendar.editCategory, 'cal-edit-category')}</div>
    <div class="fields">
      <div class="amt-wrap"><label class="sr" for="ce-amt">금액</label><input class="field right full" id="ce-amt" inputmode="numeric" autocomplete="off" value="${amount.toLocaleString('ko-KR')}"><span>원</span></div>
      <div class="memo-wrap"><label class="sr" for="ce-memo">메모</label><input class="field full" id="ce-memo" maxlength="30" autocomplete="off" value="${escapeHtml(memo)}"></div>
    </div>
    <p class="err" id="ce-err" role="alert" hidden></p>
    <div class="actions">
      <button class="btn" type="button" data-act="cal-edit-cancel">취소</button>

}

function dayRow(expense, canEdit) {
  const { id, categoryId, amount, memo } = expense;
  if (canEdit && calendar.editId === id) return editBox(expense);
  const safeId = escapeHtml(id);
  const label = escapeHtml(memo || '지출');

    ? `<button class="x" type="button" data-act="cal-edit" data-id="${safeId}" aria-label="${label} 수정">${ICON_EDIT}</button><button class="x" type="button" data-act="cal-delete" data-id="${safeId}" aria-label="${label} 삭제">${ICON_X}</button>`
    : '';
  return `<li class="line"><span class="tag">${escapeHtml(categoryName(state, categoryId))}</span><span class="grow">${escapeHtml(memo || '메모 없음')}</span><span class="tnum">${formatWon(amount)}</span>${buttons}</li>`;
}

function addBox() {
  const categories = visibleCategories(state);
  if (!categories.some(({ id }) => id === calendar.addCategory)) calendar.addCategory = categories[0]?.id ?? '';
  return `<div class="entry">
    <p class="sec-title entry-title">이 날 지출 추가</p>
    <div class="pills" role="group" aria-label="분류">${categoryChips(categories, calendar.addCategory, 'cal-add-category')}</div>
    <div class="fields">
      <div class="amt-wrap"><label class="sr" for="cn-amt">금액</label><input class="field right full" id="cn-amt" inputmode="numeric" placeholder="금액" autocomplete="off"><span>원</span></div>
      <div class="memo-wrap"><label class="sr" for="cn-memo">메모</label><input class="field full" id="cn-memo" maxlength="30" placeholder="메모 (예: 점심)" autocomplete="off"></div>
    </div>
    <p class="err" id="cn-err" role="alert" hidden></p>
    <div class="actions"><button class="btn go" type="button" data-act="cal-add">추가</button></div>
  </div>`;
}

function dayDetail() {
  const { month, selected } = calendar;
  if (selected === null || monthKeyOf(selected) !== month) return '<p class="empty">날짜를 누르면 그날 쓴 내역이 여기에 나와요.</p>';
  const canEdit = canEditDate(selected);
  const items = state.expenses.filter((expense) => expense.date === selected);
  const rows = items.map((expense) => dayRow(expense, canEdit)).join('') || '<li class="empty">이 날은 쓴 돈이 없어요.</li>';
  return `<div class="head-row"><span class="chip">${formatDay(selected)}</span><strong class="big day-total" id="day-total">${formatWon(daySpent(state, selected))}</strong></div>
    <ul class="list" id="day-list" aria-label="${formatDay(selected)} 지출 내역">${rows}</ul>
    ${canEdit ? addBox() : ''}${selected > getToday() ? '<span class="sub" id="cal-future">아직 오지 않은 날이에요.</span>' : ''}`;
}

function renderCalendar() {
  const { month } = calendar;
  const today = getToday();
  const currentMonth = monthKeyOf(today);
  const isCurrent = month === currentMonth;
  const totals = dayTotals(state, month);
  const dates = monthDates(month);
  const blanks = '<div aria-hidden="true"></div>'.repeat(weekdayIndex(dates[0]));
  const spent = monthSpent(state, month);
  const remain = isCurrent ? `<span class="sub" id="cal-remain">이번 달 남은 돈 ${formatWon(state.months[month].total - spent)}</span>` : '';
  const lock = month < currentMonth ? '<div><span class="lock" id="cal-lock">지난달 기록 · 볼 수만 있어요</span></div>' : '';
  // 다시 그려도 입력 중인 금액과 메모는 남긴다. 날짜를 옮기면 clearAddBox로 먼저 비운다.
  const draftAmount = document.getElementById('cn-amt')?.value ?? '';
  const draftMemo = document.getElementById('cn-memo')?.value ?? '';
  document.querySelector('[data-panel="calendar"]').innerHTML = `<div class="cal-wrap">
    <div class="cal-main">
      <div class="cal-head">
        <div class="cal-nav">
          <button class="nbtn" type="button" data-act="cal-prev" aria-label="이전 달"${month <= earliestMonth(state, currentMonth) ? ' disabled' : ''}>&lt;</button>
          <h2 id="cal-month" aria-live="polite">${formatMonth(month)}</h2>
          <button class="nbtn" type="button" data-act="cal-next" aria-label="다음 달"${isCurrent ? ' disabled' : ''}>&gt;</button>
        </div>
        <span class="chip" id="cal-spent">이 달 쓴 돈 ${formatWon(spent)}</span>
      </div>
      <div class="cal-grid">${WEEKDAYS.map((name) => `<span class="wd" aria-hidden="true">${name}</span>`).join('')}</div>
      <div class="cal-grid" role="group" aria-label="날짜 선택">${blanks}${dates.map((date) => dayCell(date, totals[date] ?? 0, today)).join('')}</div>
    </div>
    <div class="cal-side">${dayDetail()}${remain}${lock}</div>
  </div>`;
  const amountInput = document.getElementById('cn-amt');
  if (amountInput !== null) {
    amountInput.value = draftAmount;
    document.getElementById('cn-memo').value = draftMemo;
  }
}

function clearAddBox() {
  for (const id of ['cn-amt', 'cn-memo']) {
    const input = document.getElementById(id);
    if (input !== null) input.value = '';
  }
}

// 탭을 열면 이번 달의 오늘을 고른 상태로 시작한다.
function openCalendar() {
  const today = getToday();
  calendar.month = monthKeyOf(today);
  calendar.selected = today;
  calendar.editId = null;
  clearAddBox();
  renderCalendar();
}

function moveCalendar(delta) {
  const today = getToday();
  calendar.month = addMonths(calendar.month, delta);
  calendar.selected = calendar.month === monthKeyOf(today) ? today : null;
  calendar.editId = null;
  clearAddBox();
  renderCalendar();
}

function focusSelectedDay() {
  document.querySelector(`[data-date="${calendar.selected}"]`)?.focus();
}

// 금액 칸을 표시하고 포커스를 옮긴다. 상자를 다시 그리지 않아 입력값이 남는다.
function showCalendarError(prefix, message) {
  const error = document.getElementById(`${prefix}-err`);
  const amount = document.getElementById(`${prefix}-amt`);
  error.textContent = message;
  error.hidden = false;
  amount.setAttribute('aria-invalid', 'true');
  amount.focus();
}

function saveCalendarEdit() {
  const amount = document.getElementById('ce-amt').value;
  const memo = document.getElementById('ce-memo').value.trim();
  const message = expenseError(calendar.editCategory, amount);
  if (message !== '') {
    showCalendarError('ce', message);
    return;
  }
  updateExpense(state, calendar.editId, { categoryId: calendar.editCategory, amount: parseAmount(amount).value, memo });
  calendar.editId = null;
  saveState();
  renderCalendar();
  focusSelectedDay();
}

function submitCalendarAdd() {
  const amount = document.getElementById('cn-amt').value;
  const memo = document.getElementById('cn-memo').value.trim();
  const message = expenseError(calendar.addCategory, amount);
  if (message !== '') {
    showCalendarError('cn', message);
    return;
  }
  addExpense(state, { date: calendar.selected, categoryId: calendar.addCategory, amount: parseAmount(amount).value, memo });
  clearAddBox();
  saveState();
  renderCalendar();
  document.getElementById('cn-amt').focus();
}

function startCalendarEdit(id) {
  calendar.editId = id;
  calendar.editCategory = state.expenses.find((expense) => expense.id === id)?.categoryId ?? '';
  renderCalendar();
  document.getElementById('ce-amt')?.focus();
}

function pickChip(button) {
  button.parentNode.querySelectorAll('.pill').forEach((chip) => {
    chip.setAttribute('aria-pressed', String(chip === button));
  });
}

function handleCalendarClick(event) {
  const button = event.target.closest('[data-act]');
  if (button === null || blockedByNewMonth()) return;
  const { act, date, id } = button.dataset;
  if (act === 'cal-day') {
    calendar.selected = date;
    calendar.editId = null;
    clearAddBox();
    renderCalendar();
    focusSelectedDay();
  }
  if (act === 'cal-add') submitCalendarAdd();
  if (act === 'cal-add-category') {
    calendar.addCategory = id;
    pickChip(button);
  }
  if (act === 'cal-edit') startCalendarEdit(id);
  if (act === 'cal-edit-save') saveCalendarEdit();
  if (act === 'cal-edit-cancel') {
    calendar.editId = null;
    renderCalendar();
    focusSelectedDay();
  }
  if (act === 'cal-edit-category') {
    calendar.editCategory = id;
    pickChip(button);
  }
  if (act === 'cal-delete') {
    deleteExpense(state, id);
    saveState();
    renderCalendar();
    focusSelectedDay();
  }
  if (act === 'cal-prev' || act === 'cal-next') {
    moveCalendar(act === 'cal-prev' ? -1 : 1);
    (document.querySelector(`[data-act="${act}"]:not(:disabled)`) ?? document.querySelector('.nbtn:not(:disabled)'))?.focus();
  }
}

function handleCalendarKeydown(event) {
  if (event.key !== 'Enter' || !['ce-amt', 'ce-memo', 'cn-amt', 'cn-memo'].includes(event.target.id)) return;
  event.preventDefault();
  if (blockedByNewMonth()) return;
  if (event.target.id.startsWith('ce-')) saveCalendarEdit();
  else submitCalendarAdd();
}

// 입력 중인 값은 저장을 누르기 전까지 이번 달 기록에 반영하지 않는다.
const settings = { total: '', allocations: {} };

function settingsRow({ id, name }, byCategory) {
  const safeId = escapeHtml(id);
  return `<div class="frow tall">
    <label class="alloc-label" for="set-${safeId}">${escapeHtml(name)}<span class="sub used">사용 ${formatWon(byCategory[id] ?? 0)}</span></label>
    <div class="unit"><input class="field right" id="set-${safeId}" data-set-alloc="${safeId}" inputmode="numeric" autocomplete="off" value="${escapeHtml(settings.allocations[id] ?? '')}"><span>원</span></div>
  </div>`;
}

function currentSettings() {
  return settingsState(visibleCategories(state), state.months[monthKeyOf(getToday())], settings);
}

// 저장 전에 결과를 미리 보여준다. 총 금액이 숫자가 아니면 계산할 수 없어 -로 둔다.
function renderSettingsPreview({ total }) {
  const monthKey = monthKeyOf(getToday());
  const remain = document.getElementById('preview-remain');
  const changed = total === null ? '-' : formatWon(total);
  document.getElementById('preview-total').textContent = `현재 ${formatWon(state.months[monthKey].total)} → 변경 ${changed}`;
  if (total === null) {
    remain.textContent = '-';
    remain.classList.remove('neg');
    return;
  }
  const left = total - monthSpent(state, monthKey);
  remain.textContent = formatWon(left);
  remain.classList.toggle('neg', left < 0);
}

function renderSettingsStatus() {
  const status = currentSettings();
  const left = document.getElementById('set-left');
  left.textContent = formatWon(status.left);
  left.classList.toggle('neg-text', status.left < 0);
  document.getElementById('set-hint').textContent = settingsHint(status);
  document.getElementById('set-save').disabled = !status.ok;
  markInvalid(document.getElementById('set-total'), status.totalBad);
  document.querySelectorAll('[data-set-alloc]').forEach((input) => {
    markInvalid(input, !parseOptionalAmount(input.value).ok);
  });
  renderSettingsPreview(status);
}

function openSettings() {
  const monthKey = monthKeyOf(getToday());
  const month = state.months[monthKey];
  const categories = visibleCategories(state);
  const { byCategory } = monthSummary(state, monthKey);
  settings.total = month.total.toLocaleString('ko-KR');
  settings.allocations = Object.fromEntries(categories.map(({ id }) => [id, (month.allocations[id] ?? 0).toLocaleString('ko-KR')]));
  document.querySelector('[data-panel="settings"]').innerHTML = `<div class="col">
    <div class="head-row"><span class="chip">이번 달 예산 수정</span><span class="sub">${formatMonth(monthKey)}</span></div>
    <div class="frow total-row">
      <label class="alloc-label" for="set-total">이번 달 총 금액</label>
      <div class="unit"><input class="field right" id="set-total" inputmode="numeric" autocomplete="off" value="${escapeHtml(settings.total)}"><span>원</span></div>
    </div>
    <div><p class="sec-title tighter">분류별 배분</p>${categories.map((category) => settingsRow(category, byCategory)).join('')}</div>
    <div class="total-box mint"><span class="total-label">아직 나누지 않은 금액</span><strong class="big" id="set-left"></strong></div>
    <p class="sub hint" id="set-hint" role="status"></p>
    <div class="actions"><button class="btn" type="button" data-act="set-cancel">취소</button><button class="btn go" type="button" id="set-save" data-act="set-save">저장</button></div>
  </div>
  <div class="col">
    <div class="remain">
      <span class="chip">저장하면 이렇게 돼요</span>
      <div class="calc plain"><span>이번 달 총 금액</span><span class="tnum" id="preview-total"></span></div>
      <span class="sub">이번 달 남은 돈</span>
      <strong class="big preview" id="preview-remain"></strong>
    </div>
    <span class="lock start">지난달 기록은 수정할 수 없어요</span>
  </div>`;
  renderSettingsStatus();
}

function saveSettings() {
  const status = currentSettings();
  if (!status.ok) return;
  applyMonthEdit(state, monthKeyOf(getToday()), status.total, status.allocations);
  saveState();
  showView('dashboard');
}

function handleSettingsInput(event) {
  const { id, dataset } = event.target;
  if (id === 'set-total') settings.total = event.target.value;
  else if (dataset.setAlloc !== undefined) settings.allocations[dataset.setAlloc] = event.target.value;
  else return;
  renderSettingsStatus();
}

function handleSettingsClick(event) {
  const button = event.target.closest('[data-act]');
  if (button === null || blockedByNewMonth()) return;
  if (button.dataset.act === 'set-save') saveSettings();
  if (button.dataset.act === 'set-cancel') showView('dashboard');
}

const TOMATO_LARGE = '<svg width="64" height="64" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="27" r="17" fill="#E8503F" stroke="#2B4A22" stroke-width="3"></circle><path d="M24 12 L19 5 L24 8 L29 5 Z M14 14 L24 11 L34 14 L24 15 Z" fill="#6FB34A" stroke="#2B4A22" stroke-width="2" stroke-linejoin="round"></path><circle cx="18" cy="27" r="2" fill="#2B4A22"></circle><circle cx="30" cy="27" r="2" fill="#2B4A22"></circle><circle cx="14" cy="32" r="2.5" fill="#F7A19A"></circle><circle cx="34" cy="32" r="2.5" fill="#F7A19A"></circle></svg>';

// 입력값은 화면을 다시 그릴 때 속성이 아닌 값으로만 되돌린다. 비밀번호가 HTML에 남지 않게 한다.
let auth = { mode: 'login', email: '', pw: '', pw2: '', errors: {}, busy: false };
let client = null;

// 세션은 sessionStorage에만 둔다. 브라우저를 닫으면 로그인이 끝난다. (기본값 localStorage는 쓰지 않는다)
function db() {
  client ??= globalThis.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { storage: sessionStorage, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
  });
  return client;
}

// 대문자로 입력해도 같은 이메일로 본다.
function normalizeEmail(email) {
  return email.trim().toLowerCase();
}

// 입력 오류를 칸별로 돌려준다. 비어 있으면 통과다. 이미 가입된 이메일은 서버가 알려 준다.
function authErrors({ mode, email, pw, pw2 }) {
  const errors = {};
  const normalized = normalizeEmail(email);
  if (normalized === '') errors.email = '이메일을 입력해 주세요.';
  else if (!EMAIL_PATTERN.test(normalized)) errors.email = '이메일 형식으로 입력해 주세요.';
  if (pw === '') errors.pw = '비밀번호를 입력해 주세요.';
  if (mode === 'signup') {
    if (errors.pw === undefined && pw.length < PASSWORD_MIN) errors.pw = '비밀번호는 8자 이상으로 만들어 주세요.';
    if (pw2 === '') errors.pw2 = '비밀번호를 한 번 더 입력해 주세요.';
    else if (pw2 !== pw) errors.pw2 = '비밀번호가 서로 달라요.';
  }
  return errors;
}

// Supabase 오류 코드를 입력칸 안내로 바꾼다. 연결 문제를 "비밀번호가 틀렸다"로 말하지 않게 나머지는 따로 안내한다.
function authServerErrors(code, mode) {
  if (mode === 'login' && code === 'invalid_credentials') return { pw: '이메일 또는 비밀번호가 맞지 않아요.', emailRed: true };
  if (mode === 'signup' && (code === 'user_already_exists' || code === 'email_exists')) return { email: '이미 가입된 이메일이에요.' };
  if (mode === 'signup' && code === 'weak_password') return { pw: '비밀번호는 8자 이상으로 만들어 주세요.' };
  if (code === 'email_address_invalid') return { email: '이메일 형식으로 입력해 주세요.' };
  return { pw: '지금은 처리할 수 없어요. 잠시 후 다시 시도해 주세요.' };
}

// 성공하면 사용자 id, 실패하면 오류 코드를 돌려준다. 라이브러리를 못 불러온 경우도 실패로 다룬다.
async function requestAuth({ mode, email, pw }) {
  const form = { email: normalizeEmail(email), password: pw };
  try {
    const { data, error } = mode === 'signup' ? await db().auth.signUp(form) : await db().auth.signInWithPassword(form);
    if (error) return { code: error.code };
    return data.session ? { userId: data.user.id } : {};
  } catch {
    return {};
  }
}

function authField(id, label, type, hint, error, autocomplete, red) {
  const invalid = error || red ? ' aria-invalid="true"' : '';
  const note = error
    ? `<span class="err" role="alert">${escapeHtml(error)}</span>`
    : (hint ? `<span class="sub">${hint}</span>` : '');
  const plain = type === 'email' ? ' autocapitalize="off" spellcheck="false"' : '';
  return `<div class="afield"><label for="${id}">${label}</label><input class="field" id="${id}" type="${type}" autocomplete="${autocomplete}"${plain}${invalid}>${note}</div>`;
}

function renderAuth() {
  const { mode, errors } = auth;
  const login = mode === 'login';
  const fields = login
    ? authField('a-email', '이메일', 'email', '', errors.email, 'email', errors.emailRed)
      + authField('a-pw', '비밀번호', 'password', '', errors.pw, 'current-password')
    : authField('a-email', '이메일', 'email', '', errors.email, 'email')
      + authField('a-pw', '비밀번호', 'password', '8자 이상으로 만들어 주세요', errors.pw, 'new-password')
      + authField('a-pw2', '비밀번호 확인', 'password', '', errors.pw2, 'new-password');
  document.getElementById('authview').innerHTML = `<div class="auth-col">
    <div class="auth-tabs">
      <button class="tab" type="button" data-auth="login"${login ? ' aria-current="page"' : ''}>로그인</button>
      <button class="tab" type="button" data-auth="signup"${login ? '' : ' aria-current="page"'}>회원가입</button>
    </div>
    <main class="book auth-card">
      <form class="inner" id="auth-form" novalidate>
        <div class="auth-head">${TOMATO_LARGE}<h1>생활비 통장</h1><p class="sub auth-lead">${login ? '로그인하고 이번 달 생활비를 관리해요' : '계정을 만들고 생활비 기록을 시작해요'}</p></div>
        ${fields}
        <button class="btn go wide" type="submit">${login ? '로그인' : '회원가입'}</button>
        <p class="auth-foot">${login ? '계정이 없나요? <button type="button" data-auth="signup">회원가입</button>' : '이미 계정이 있나요? <button type="button" data-auth="login">로그인</button>'}</p>
      </form>
    </main>
  </div>`;
  document.getElementById('a-email').value = auth.email;
  document.getElementById('a-pw').value = auth.pw;
  if (!login) document.getElementById('a-pw2').value = auth.pw2;
}

function showAuth(mode) {
  auth = { mode, email: '', pw: '', pw2: '', errors: {}, busy: false };
  document.getElementById('app').hidden = true;
  document.getElementById('authview').hidden = false;
  renderAuth();
  document.getElementById('a-email').focus();
}

function showAuthErrors(errors) {
  auth.errors = errors;
  renderAuth();
  document.querySelector('#authview [aria-invalid="true"]')?.focus();
}

function enterAs(userId) {
  currentUser = userId;
  document.getElementById('authview').hidden = true;
  const result = loadData(userId);
  if (result.status === 'corrupt') {
    showRecovery();
    return;
  }
  state = result.data;
  if (result.status === 'empty') saveState();
  enterApp();
  showView('dashboard');
}

async function submitAuth() {
  if (auth.busy) return;
  const errors = authErrors(auth);
  if (Object.keys(errors).length > 0) {
    showAuthErrors(errors);
    return;
  }
  auth.busy = true;
  document.querySelector('#auth-form button[type="submit"]').disabled = true;
  const { userId, code } = await requestAuth(auth);
  auth.busy = false;
  if (userId === undefined) showAuthErrors(authServerErrors(code, auth.mode));
  else enterAs(userId);
}

function handleAuthInput(event) {
  const { id, value } = event.target;
  if (id === 'a-email') auth.email = value;
  if (id === 'a-pw') auth.pw = value;
  if (id === 'a-pw2') auth.pw2 = value;
}

// 새로고침하면 남아 있는 세션으로 다시 들어간다.
async function sessionUser() {
  try {
    const { data } = await db().auth.getSession();
    return data.session?.user.id ?? null;
  } catch {
    return null;
  }
}

// ---- 화면 ----

function showView(name) {
  document.querySelectorAll('[data-panel]').forEach((panel) => {
    panel.hidden = panel.dataset.panel !== name;
  });
  document.querySelectorAll('[data-view]').forEach((item) => {
    if (item.dataset.view === name) item.setAttribute('aria-current', 'page');
    else item.removeAttribute('aria-current');
  });
  if (name === 'dashboard') renderDashboard();
  if (name === 'calendar') openCalendar();
  if (name === 'settings') openSettings();
}

function showRecovery() {
  document.getElementById('recovery').hidden = false;
}

function setResetConfirm(open) {
  document.getElementById('reset-start').hidden = open;
  document.getElementById('reset-confirm').hidden = !open;
}

// 이번 달이 정산되지 않았으면 앱 위에 정산 창을 띄운다. 끝내기 전에는 뒤의 앱을 쓸 수 없다.
function enterApp() {
  const today = getToday();
  const monthKey = monthKeyOf(today);
  const settling = needsSettlement(state, monthKey);
  const app = document.getElementById('app');
  document.getElementById('today-label').textContent = formatDate(today);
  document.getElementById('overlay').hidden = !settling;
  app.hidden = false;
  app.inert = settling;
  if (settling && settle?.monthKey !== monthKey) startSettle(monthKey);
  renderDashboard();
}

function resetData() {
  state = createEmptyData();
  saveState();
  document.getElementById('recovery').hidden = true;
  enterApp();
}

async function init() {
  document.querySelectorAll('[data-view]').forEach((item) => {
    item.addEventListener('click', () => showView(item.dataset.view));
  });
  document.getElementById('reset-start').addEventListener('click', () => setResetConfirm(true));
  document.getElementById('reset-cancel').addEventListener('click', () => setResetConfirm(false));
  document.getElementById('reset-run').addEventListener('click', resetData);
  document.getElementById('settle-form').addEventListener('submit', handleSettleSubmit);
  document.getElementById('settle-back').addEventListener('click', () => moveSettle(1));
  document.getElementById('settle-form').addEventListener('input', handleSettleInput);
  document.getElementById('alloc-rows').addEventListener('input', handleAllocationInput);
  document.querySelector('[data-step="2"]').addEventListener('click', handleCategoryClick);
  // 금액을 넣다가 Enter로 바로 저장되지 않게 한다. 저장은 버튼으로만 한다.
  document.querySelector('[data-step="2"]').addEventListener('keydown', (event) => {
    if (event.key !== 'Enter') return;
    if (event.target.id === 'new-cat') {
      event.preventDefault();
      addCategory();
    } else if (event.target.matches('[data-alloc]')) {
      event.preventDefault();
    }
  });
  const dashboardPanel = document.querySelector('[data-panel="dashboard"]');
  dashboardPanel.addEventListener('click', handleDashboardClick);
  dashboardPanel.addEventListener('keydown', handleDashboardKeydown);
  const calendarPanel = document.querySelector('[data-panel="calendar"]');
  calendarPanel.addEventListener('click', handleCalendarClick);
  calendarPanel.addEventListener('keydown', handleCalendarKeydown);
  const settingsPanel = document.querySelector('[data-panel="settings"]');
  settingsPanel.addEventListener('input', handleSettingsInput);
  settingsPanel.addEventListener('click', handleSettingsClick);
  document.addEventListener('visibilitychange', () => {
    if (state !== null && document.visibilityState === 'visible') enterApp();
  });

  const authview = document.getElementById('authview');
  authview.addEventListener('input', handleAuthInput);
  authview.addEventListener('submit', (event) => {
    event.preventDefault();
    submitAuth();
  });
  authview.addEventListener('click', (event) => {
    const button = event.target.closest('[data-auth]');
    if (button !== null && !auth.busy) showAuth(button.dataset.auth);
  });

  const userId = await sessionUser();
  if (userId === null) showAuth('login');
  else enterAs(userId);
}

init();
</script>
</body>
</html>
