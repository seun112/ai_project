<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생활비 통장</title>
<style>
  :root {
    color-scheme: light;
    --paper: #E9F0EC;
    --surface: #F8FBF9;
    --ink: #14322B;
    --ink-soft: #56706A;
    --pine: #1E6B57;
    --seal: #C4213A;
    --line: #C9D8D1;
    --nav-width: 13rem;
    --row: 2.75rem;
    --font: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 1rem/1.6 var(--font);
    font-variant-numeric: tabular-nums;
    word-break: keep-all;
  }

  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--pine); outline-offset: 2px; }

  .app {
    display: grid;
    grid-template-columns: var(--nav-width) minmax(0, 1fr);
    min-height: 100vh;
  }

  .nav {
    position: sticky;
    top: 0;
    align-self: start;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    height: 100vh;
    padding: 1.5rem 0.75rem;
    background: var(--ink);
    color: var(--surface);
  }
  .nav:focus-visible, .nav button:focus-visible { outline-color: var(--surface); }

  .brand {
    margin: 0 0 1.25rem;
    padding: 0 0.75rem;
    font-size: 1.125rem;
    font-weight: 700;
  }

  .nav-item {
    padding: 0.625rem 0.75rem;
    border: 0;
    border-radius: 4px;
    background: none;
    text-align: left;
  }
  .nav-item:hover { background: rgb(248 251 249 / 0.1); }
  .nav-item[aria-current="page"] {
    background: var(--surface);
    color: var(--ink);
    font-weight: 700;
  }

  .main {
    width: 100%;
    max-width: 44rem;
    margin-inline: auto;
    padding: 2.5rem 1.5rem;
  }

  .month {
    margin: 0;
    color: var(--ink-soft);
  }

  .view h1 {
    margin: 0 0 1.5rem;
    font-size: 1.5rem;
    line-height: 1.3;
  }

  /* 통장 속지처럼 일정한 간격의 줄 */
  .ledger {
    min-height: calc(var(--row) * 6 + 1px);
    padding: 0 1rem;
    border-top: 2px solid var(--ink);
    background:
      repeating-linear-gradient(
        to bottom,
        transparent 0 calc(var(--row) - 1px),
        var(--line) calc(var(--row) - 1px) var(--row)
      )
      var(--surface);
  }

  .empty {
    margin: 0;
    color: var(--ink-soft);
    line-height: var(--row);
  }

  .notice {
    margin: 0;
    padding: 0.75rem 1rem;
    background: var(--ink);
    color: var(--surface);
    text-align: center;
  }

  .recovery {
    max-width: 32rem;
    margin-inline: auto;
    padding: 4rem 1rem;
  }
  .recovery h1 { margin: 0 0 0.75rem; font-size: 1.5rem; line-height: 1.3; }
  .recovery p { margin: 0 0 1.25rem; }

  .button {
    padding: 0.625rem 1rem;
    border: 1px solid var(--ink);
    border-radius: 4px;
    background: var(--surface);
  }
  .button-solid { background: var(--ink); color: var(--surface); }
  .button-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }

  @media (max-width: 40rem) {
    .app { display: block; }

    .nav {
      position: fixed;
      inset: auto 0 0;
      z-index: 1;
      flex-direction: row;
      gap: 0;
      height: auto;
      padding: 0.25rem;
      padding-bottom: calc(0.25rem + env(safe-area-inset-bottom, 0px));
    }
    .brand { display: none; }
    .nav-item { flex: 1 1 0; padding: 0.5rem 0.25rem; font-size: 0.875rem; text-align: center; }

    .main { padding: 1.5rem 1rem 6rem; }
  }
</style>
</head>
<body>
  <p class="notice" id="save-error" role="alert" hidden>저장하지 못했습니다. 브라우저 저장 공간을 확인한 뒤 다시 시도하세요.</p>

  <section class="recovery" id="recovery" hidden>
    <h1>저장된 데이터를 읽을 수 없습니다</h1>
    <p>데이터가 손상되었거나 지원하지 않는 형식입니다. 저장된 원본은 지우지 않았습니다.</p>
    <button class="button" id="reset-start" type="button">데이터 초기화</button>
    <div id="reset-confirm" role="alert" hidden>
      <p>모든 데이터가 삭제되고 되돌릴 수 없습니다.</p>
      <div class="button-row">
        <button class="button button-solid" id="reset-run" type="button">모두 삭제하고 새로 시작</button>
        <button class="button" id="reset-cancel" type="button">취소</button>
      </div>
    </div>
  </section>

  <div class="app" id="app">
    <nav class="nav" aria-label="메뉴">
      <p class="brand">생활비 통장</p>
      <button class="nav-item" type="button" data-view="dashboard" aria-current="page">대시보드</button>
      <button class="nav-item" type="button" data-view="calendar">달력</button>
      <button class="nav-item" type="button" data-view="weekly">주간</button>
      <button class="nav-item" type="button" data-view="piggy">저금통</button>
      <button class="nav-item" type="button" data-view="settings">설정</button>
    </nav>

    <main class="main">
      <p class="month" id="month-label"></p>
      <section class="view" data-panel="dashboard">
        <h1>대시보드</h1>
        <div class="ledger"><p class="empty">이번 달 예산을 정하면 남은 돈이 여기에 표시됩니다.</p></div>
      </section>
      <section class="view" data-panel="calendar" hidden>
        <h1>달력</h1>
        <div class="ledger"><p class="empty">날짜별 지출이 여기에 표시됩니다.</p></div>
      </section>
      <section class="view" data-panel="weekly" hidden>
        <h1>주간</h1>
        <div class="ledger"><p class="empty">월요일부터 일요일까지 주별 지출이 여기에 표시됩니다.</p></div>
      </section>
      <section class="view" data-panel="piggy" hidden>
        <h1>저금통</h1>
        <div class="ledger"><p class="empty">저축하고 사용한 내역이 여기에 표시됩니다.</p></div>
      </section>
      <section class="view" data-panel="settings" hidden>
        <h1>설정</h1>
        <div class="ledger"><p class="empty">분류를 여기에서 관리합니다.</p></div>
      </section>
    </main>
  </div>

<script>
'use strict';

// ---- 상수 ----

const STORAGE_KEY = 'living-budget';
const DATA_VERSION = 1;
const DEFAULT_CATEGORIES = ['식비', '의류', '취미', '기타'];

// ---- 금액 유틸 ----

// 원 단위 정수만 받는다. 쉼표는 천 단위 위치에만 허용한다.
function parseAmount(text, { min = 0 } = {}) {
  const raw = String(text ?? '').trim();
  if (raw === '') return { ok: false, error: '금액을 입력하세요.' };
  if (raw.startsWith('-')) return { ok: false, error: '음수는 입력할 수 없습니다.' };
  if (raw.includes('.')) return { ok: false, error: '소수점 없이 원 단위로 입력하세요.' };
  if (!/^(\d+|\d{1,3}(,\d{3})+)$/.test(raw)) return { ok: false, error: '숫자만 입력하세요.' };

  const value = Number(raw.replaceAll(',', ''));
  if (!Number.isSafeInteger(value)) return { ok: false, error: '금액이 너무 큽니다.' };
  if (value < min) return { ok: false, error: `${formatWon(min)} 이상 입력하세요.` };
  return { ok: true, value };
}

function formatWon(amount) {
  return `${(amount || 0).toLocaleString('ko-KR')}원`;
}

// ---- 날짜 유틸 ----

// 날짜는 'YYYY-MM-DD', 달은 'YYYY-MM' 문자열로 다룬다.
// toISOString은 UTC로 바뀌어 한국 시간 오전에 날짜가 밀리므로 쓰지 않는다.
function pad2(number) {
  return String(number).padStart(2, '0');
}

function toDateKey(date) {
  return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
}

// 오늘 날짜를 얻는 유일한 함수. 월 전환 테스트는 이 함수만 바꾼다.
function getToday() {
  return toDateKey(new Date());
}

function monthKeyOf(dateKey) {
  return dateKey.slice(0, 7);
}

function addMonths(monthKey, delta) {
  const [year, month] = monthKey.split('-').map(Number);
  const date = new Date(year, month - 1 + delta, 1);
  return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}`;
}

function daysInMonth(monthKey) {
  const [year, month] = monthKey.split('-').map(Number);
  return new Date(year, month, 0).getDate();
}

function monthDates(monthKey) {
  return Array.from({ length: daysInMonth(monthKey) }, (_, i) => `${monthKey}-${pad2(i + 1)}`);
}

// 월요일 0 ~ 일요일 6
function weekdayIndex(dateKey) {
  const [year, month, day] = dateKey.split('-').map(Number);
  return (new Date(year, month - 1, day).getDay() + 6) % 7;
}

// 월~일 단위로 묶는다. 달 경계에 걸친 주에는 해당 달 날짜만 담는다.
function weeksOfMonth(monthKey) {
  const weeks = [];
  for (const dateKey of monthDates(monthKey)) {
    if (weeks.length === 0 || weekdayIndex(dateKey) === 0) weeks.push([]);
    weeks.at(-1).push(dateKey);
  }
  return weeks;
}

function isLockedDate(dateKey) {
  return monthKeyOf(dateKey) < monthKeyOf(getToday());
}

function formatMonth(monthKey) {
  const [year, month] = monthKey.split('-').map(Number);
  return `${year}년 ${month}월`;
}

// ---- 저장소 ----

let state = null;

function createId(prefix) {
  return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
}

function createEmptyData() {
  return {
    version: DATA_VERSION,
    categories: DEFAULT_CATEGORIES.map((name) => ({ id: createId('cat'), name, hidden: false })),
    months: {},
    expenses: [],
    piggy: { balance: 0, history: [] },
    unsettled: [],
  };
}

function isPlainObject(value) {
  return typeof value === 'object' && value !== null && !Array.isArray(value);
}

function isValidCategory(category) {
  return isPlainObject(category)
    && typeof category.id === 'string'
    && typeof category.name === 'string'
    && typeof category.hidden === 'boolean';
}

function isValidData(data) {
  return isPlainObject(data)
    && data.version === DATA_VERSION
    && Array.isArray(data.categories)
    && data.categories.every(isValidCategory)
    && isPlainObject(data.months)
    && Array.isArray(data.expenses)
    && isPlainObject(data.piggy)
    && Number.isSafeInteger(data.piggy.balance)
    && Array.isArray(data.piggy.history)
    && Array.isArray(data.unsettled);
}

// 손상된 값은 읽기만 하고 덮어쓰지 않는다. 지우는 것은 사용자가 고른다.
function loadData() {
  let raw = null;
  try {
    raw = localStorage.getItem(STORAGE_KEY);
  } catch {
    return { status: 'empty', data: createEmptyData() };
  }
  if (raw === null) return { status: 'empty', data: createEmptyData() };

  try {
    const data = JSON.parse(raw);
    return isValidData(data) ? { status: 'ok', data } : { status: 'corrupt' };
  } catch {
    return { status: 'corrupt' };
  }
}

function saveData(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  } catch {
    return false;
  }
}

function saveState() {
  document.getElementById('save-error').hidden = saveData(state);
}

// ---- 화면 ----

function showView(name) {
  document.querySelectorAll('[data-panel]').forEach((panel) => {
    panel.hidden = panel.dataset.panel !== name;
  });
  document.querySelectorAll('[data-view]').forEach((item) => {
    if (item.dataset.view === name) item.setAttribute('aria-current', 'page');
    else item.removeAttribute('aria-current');
  });
}

function showRecovery() {
  document.getElementById('app').hidden = true;
  document.getElementById('recovery').hidden = false;
}

function setResetConfirm(open) {
  document.getElementById('reset-start').hidden = open;
  document.getElementById('reset-confirm').hidden = !open;
}

function resetData() {
  state = createEmptyData();
  saveState();
  document.getElementById('recovery').hidden = true;
  document.getElementById('app').hidden = false;
}

function init() {
  document.getElementById('month-label').textContent = formatMonth(monthKeyOf(getToday()));
  document.querySelectorAll('[data-view]').forEach((item) => {
    item.addEventListener('click', () => showView(item.dataset.view));
  });
  document.getElementById('reset-start').addEventListener('click', () => setResetConfirm(true));
  document.getElementById('reset-cancel').addEventListener('click', () => setResetConfirm(false));
  document.getElementById('reset-run').addEventListener('click', resetData);

  const result = loadData();
  if (result.status === 'corrupt') {
    showRecovery();
    return;
  }
  state = result.data;
  if (result.status === 'empty') saveState();
}

init();
</script>
</body>
</html>
