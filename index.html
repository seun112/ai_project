<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생활비 통장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #D9F0BC; --stripe: rgba(255,255,255,0.5); --paper: #FFFBE3; --ink: #2B4A22; --soft: #4F6B3F;
  --dot: #A8CB8B; --dash: #7FB069; --field: #FFFFFF; --accent: #8CCB4F; --accent-ink: #1F3D17;
  --yellow: #FFF1A8; --mint: #EAF6D6; --tab: #BFE08F; --tab-line: #7FA566; --seal: #C4213A;
  --track: #FFFBE3; --veil: rgba(43,74,34,0.6); --off: #E3E8D5; --off-ink: #60705A; --off-line: #A9B79A;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  background-color: var(--bg);
  background-image: linear-gradient(90deg, var(--stripe) 50%, transparent 50%), linear-gradient(var(--stripe) 50%, transparent 50%);
  background-size: 44px 44px;
  color: var(--ink);
  font-family: 'Gowun Dodum', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  font-size: 17px; line-height: 1.6;
}
button, input { font-family: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.jua { font-family: 'Jua', 'Gowun Dodum', sans-serif; font-weight: 400; }
.tnum { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1128px; margin: 0 auto; padding: 40px 24px 64px; }

/* 탭 */
.tabs { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px; padding-left: 28px; }
.tab { padding: 6px 18px 4px; border: 3px solid var(--tab-line); border-bottom: none; border-radius: 14px 14px 0 0; background: var(--tab); color: var(--ink); font-family: 'Jua', 'Gowun Dodum', sans-serif; font-size: 16px; cursor: pointer; }
.tab[aria-current="page"] { padding: 8px 22px 6px; border-color: var(--ink); background: var(--paper); font-size: 19px; cursor: default; }
.date { margin-left: auto; padding-bottom: 6px; font-family: 'Jua', 'Gowun Dodum', sans-serif; font-size: 17px; }
.date small { font-family: 'Gowun Dodum', sans-serif; color: var(--soft); font-size: 13px; }

/* 노트 */
.book { margin-top: -3px; padding: 14px; border: 4px solid var(--ink); border-radius: 28px; background: var(--paper); }
.inner { border: 2px dashed var(--dash); border-radius: 18px; padding: 28px; display: flex; flex-wrap: wrap; gap: 32px; }
.col { flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.chip { display: inline-block; padding: 2px 12px; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 14px; }
.head-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 10px; border-bottom: 2px dotted var(--dot); }
.big { font-family: 'Jua', 'Gowun Dodum', sans-serif; font-weight: 400; font-variant-numeric: tabular-nums; }
.remain { padding: 18px 20px 20px; border: 2px solid var(--ink); border-radius: 18px; background: var(--mint); display: flex; flex-direction: column; gap: 10px; }
.remain .chip { align-self: flex-start; }
.remain .big { font-size: 56px; line-height: 1.2; }
.remain .big.neg { color: var(--seal); }
.meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: 15px; color: var(--soft); }
.bar { height: 12px; border: 2px solid var(--ink); border-radius: 999px; background: var(--track); overflow: hidden; }
.bar.lg { height: 16px; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.bar.over { border-color: var(--seal); }
.bar.over > i { background: var(--seal); }
.sub { font-size: 14px; color: var(--soft); }
.over-pill { padding: 0 10px; border: 2px solid var(--seal); border-radius: 999px; color: var(--seal); font-family: 'Gowun Dodum', sans-serif; font-size: 13px; font-weight: 700; }
.neg-text { color: var(--seal); }

.entry { padding: 16px; border: 2px solid var(--ink); border-radius: 18px; background: var(--yellow); display: flex; flex-direction: column; gap: 12px; }
.entry h2, .sec-title { margin: 0; font-family: 'Jua', 'Gowun Dodum', sans-serif; font-weight: 400; font-size: 20px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { min-height: 40px; padding: 0 16px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); color: var(--ink); font-size: 16px; cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.fields { display: flex; flex-wrap: wrap; gap: 8px; }
.field { height: 46px; padding: 0 14px; border: 2px solid var(--ink); border-radius: 14px; background: var(--field); color: var(--ink); font-size: 18px; min-width: 0; }
.field.right { text-align: right; font-variant-numeric: tabular-nums; }
.field[aria-invalid="true"] { border-color: var(--seal); }
.err { margin: 0; color: var(--seal); font-size: 14px; font-weight: 700; }
.btn { min-height: 46px; padding: 0 24px; border: 3px solid var(--ink); border-radius: 999px; background: var(--paper); color: var(--ink); font-family: 'Jua', 'Gowun Dodum', sans-serif; font-size: 18px; cursor: pointer; }
.btn.go { background: var(--accent); color: var(--accent-ink); }
.btn.small { min-height: 36px; padding: 0 14px; border-width: 2px; font-family: 'Gowun Dodum', sans-serif; font-size: 15px; }
.btn:disabled { background: var(--off); color: var(--off-ink); border-color: var(--off-line); cursor: not-allowed; }

.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.line { display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 2px dotted var(--dot); }
.line:last-child { border-bottom: none; }
.grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.tag { padding: 1px 10px; border: 2px solid var(--ink); border-radius: 999px; font-size: 14px; white-space: nowrap; }
.empty { padding: 14px 0; color: var(--soft); }
.x { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; border: 2px solid var(--ink); border-radius: 50%; background: var(--paper); cursor: pointer; flex: none; }
.x svg { stroke: var(--ink); }
.cat-row { padding: 10px 0 12px; border-bottom: 2px dotted var(--dot); display: flex; flex-direction: column; gap: 6px; }
.cat-row:last-child { border-bottom: none; }
.cat-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.cat-name { display: flex; align-items: center; gap: 8px; font-family: 'Jua', 'Gowun Dodum', sans-serif; font-size: 18px; }
.notice { margin: 0; padding: 10px 14px; border: 2px dashed var(--dash); border-radius: 14px; background: var(--field); font-size: 15px; }
.placeholder { flex: 1 1 100%; padding: 40px 0; text-align: center; color: var(--soft); }
.piggy-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px; border: 2px dashed var(--dash); border-radius: 16px; background: var(--field); }

/* 달력 */
.cal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.cal-nav { display: flex; align-items: center; gap: 10px; }
.cal-nav h2 { margin: 0; font-family: 'Jua', 'Gowun Dodum', sans-serif; font-weight: 400; font-size: 26px; min-width: 7.5em; text-align: center; }
.nbtn { width: 44px; height: 44px; padding: 0; border: 2px solid var(--ink); border-radius: 50%; background: var(--paper); color: var(--ink); font-family: 'Jua', 'Gowun Dodum', sans-serif; font-size: 20px; cursor: pointer; }
.nbtn:disabled { background: var(--off); color: var(--off-ink); border-color: var(--off-line); cursor: not-allowed; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wd { text-align: center; font-family: 'Jua', 'Gowun Dodum', sans-serif; font-size: 15px; color: var(--soft); }
.day { min-height: 82px; padding: 6px 7px; border: 2px solid var(--dot); border-radius: 12px; background: var(--field); color: var(--ink); display: flex; flex-direction: column; justify-content: space-between; align-items: stretch; text-align: left; cursor: pointer; font-size: 15px; }
.day .n { font-family: 'Jua', 'Gowun Dodum', sans-serif; font-size: 16px; line-height: 1.3; }
.day .n small { font-family: 'Gowun Dodum', sans-serif; font-size: 11px; }
.day .a { font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; min-height: 1.3em; white-space: nowrap; }
.day.has { background: var(--mint); border-color: var(--ink); }
.day.today { border-width: 3px; border-color: var(--ink); }
.day[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.cal-wrap { flex: 1 1 100%; min-width: 0; display: grid; grid-template-columns: minmax(0, 3fr) minmax(240px, 2fr); gap: 28px; align-items: start; }
.cal-main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.cal-side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.day .a small { font-size: 11px; }
.day .a.zero { color: var(--soft); opacity: 0.7; }
.day[aria-pressed="true"] .a.zero { color: var(--paper); }
@media (max-width: 720px) { .cal-wrap { grid-template-columns: minmax(0, 1fr); } }
.lock { display: inline-block; padding: 1px 10px; border: 2px dashed var(--dash); border-radius: 999px; font-size: 13px; color: var(--soft); }

/* 로그인 / 회원가입 */
.auth { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 40px 24px; }
.auth-col { width: 100%; max-width: 480px; }
.auth-tabs { display: flex; align-items: flex-end; gap: 6px; padding-left: 28px; }
.auth-card .inner { display: flex; flex-direction: column; flex-wrap: nowrap; gap: 20px; padding: 34px 32px 30px; }
.auth-head { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.auth-head h1 { margin: 0; font-family: 'Jua', 'Gowun Dodum', sans-serif; font-weight: 400; font-size: 34px; line-height: 1.25; }
.afield { display: flex; flex-direction: column; gap: 6px; }
.afield label { font-family: 'Jua', 'Gowun Dodum', sans-serif; font-size: 18px; }
.afield .field { width: 100%; height: 50px; padding: 0 16px; }
.afield .err { font-size: 14px; }
.btn.wide { min-height: 52px; width: 100%; font-size: 20px; }
.auth-foot { margin: 0; padding-top: 14px; border-top: 2px dotted var(--dot); text-align: center; font-size: 15px; }
.auth-foot button { padding: 0; border: 0; background: none; color: var(--ink); font-size: 15px; font-weight: 700; text-decoration: underline; cursor: pointer; }

/* 정산 창 */
#overlay { position: fixed; inset: 0; z-index: 10; background: var(--veil); display: flex; justify-content: center; align-items: flex-start; overflow: auto;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 12px calc(16px + env(safe-area-inset-bottom, 0px)); }
.dialog { width: 100%; max-width: 640px; padding: 12px; border: 4px solid var(--ink); border-radius: 28px; background: var(--paper); }
.dialog-in { border: 2px dashed var(--dash); border-radius: 18px; padding: 22px 26px 24px; display: flex; flex-direction: column; gap: 16px; }
.dlg-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.dlg-head .left { display: flex; align-items: center; gap: 10px; }
.result { padding: 12px 16px; border: 2px solid var(--ink); border-radius: 16px; background: var(--mint); display: flex; flex-direction: column; gap: 2px; }
.result.bad { border-color: var(--seal); background: var(--field); }
.result .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.result .amt { font-weight: 400; font-family: 'Jua', 'Gowun Dodum', sans-serif; font-size: 30px; font-variant-numeric: tabular-nums; }
.result.bad .amt { color: var(--seal); }
.block { display: flex; flex-direction: column; }
.block .sec-title { margin-bottom: 4px; }
.frow { display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 56px; border-bottom: 2px dotted var(--dot); }
.frow:last-child { border-bottom: none; }
.unit { display: flex; align-items: center; gap: 8px; }
.frow .field { width: 150px; }
.opt .unit .field { width: 150px; }
.calc { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; min-height: 52px; padding-top: 8px; border-bottom: 2px dotted var(--dot); }
.total-box { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0 16px; padding: 10px 16px 12px; border-top: 4px double var(--ink); background: var(--yellow); border-radius: 0 0 14px 14px; }
.total-box.mint { background: var(--mint); }
.total-box .big { font-size: 34px; line-height: 1.3; }
.check { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border: 2px dashed var(--dash); border-radius: 14px; background: var(--field); }
.check .msg { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.opt { padding: 10px 14px; border: 2px solid var(--ink); border-radius: 16px; background: var(--field); }
.opt.on { border-width: 3px; background: var(--yellow); }
.opt label { display: flex; align-items: center; gap: 10px; min-height: 36px; font-family: 'Jua', 'Gowun Dodum', sans-serif; font-size: 18px; cursor: pointer; }
.opt input[type="radio"] { width: 20px; height: 20px; margin: 0; accent-color: var(--ink); }
.opt .more { display: flex; flex-direction: column; gap: 8px; padding: 8px 0 2px 30px; }
fieldset { margin: 0; padding: 0; border: 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
legend { padding: 0; margin-bottom: 8px; font-family: 'Jua', 'Gowun Dodum', sans-serif; font-size: 19px; }
.confirm { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border: 2px solid var(--seal); border-radius: 14px; background: var(--field); }
.add-cat { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border: 2px dashed var(--dash); border-radius: 16px; background: var(--field); }
.add-cat .field { flex: 1 1 200px; background: var(--paper); }
.actions { display: flex; justify-content: flex-end; gap: 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 560px) {
  .inner { padding: 18px 14px; }
  .remain .big { font-size: 40px; }
  .dialog-in { padding: 18px 14px 20px; }
  .frow .field { width: 120px; }
  .tab { padding: 6px 12px 4px; }
  .day { min-height: 58px; padding: 4px 4px; }
  .day .a { font-size: 11px; }
  .day .a small { display: none; }
  .cal-nav h2 { font-size: 21px; min-width: 6.5em; }
}

/* 목업에 없는 화면: 저장 실패 안내와 손상 데이터 복구 */
.save-error { margin: 0; padding: 12px 16px; background: var(--seal); color: var(--paper); text-align: center; }
.recovery { width: calc(100% - 32px); max-width: 560px; margin: 64px auto; word-break: keep-all; }
.recovery .inner { display: block; }
.recovery h1 { margin: 0 0 12px; font-family: 'Jua', 'Gowun Dodum', sans-serif; font-weight: 400; font-size: 28px; line-height: 1.3; }
.recovery p { margin: 0 0 20px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* 목업의 인라인 스타일을 옮긴 것 */
.panel { flex: 1 1 100%; min-width: 0; }
.dlg-title { display: flex; align-items: center; gap: 12px; }
.dlg-title h2 { margin: 0; font-family: 'Jua', 'Gowun Dodum', sans-serif; font-weight: 400; font-size: 30px; line-height: 1.25; }
.step { display: flex; flex-direction: column; gap: 16px; }
.alloc-label { font-family: 'Jua', 'Gowun Dodum', sans-serif; font-size: 20px; }
.total-label { font-family: 'Jua', 'Gowun Dodum', sans-serif; font-size: 18px; }
.sum-line { display: flex; justify-content: space-between; align-items: baseline; }
.result.yellow { background: var(--yellow); }
.calc.last { border-bottom: none; }
.over-head { display: flex; align-items: center; gap: 8px; }
.mix-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; }
.opt label.mix-label { font-size: 15px; }
.mix-msg { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.confirm-btns { display: flex; gap: 6px; }
.x:disabled { background: var(--off); border-color: var(--off-line); cursor: not-allowed; }
.add-btn { display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 18px; font-size: 17px; }
#settle-error { margin-top: 6px; }
</style>
</head>
<body>
  <p class="save-error" id="save-error" role="alert" hidden>저장하지 못했습니다. 브라우저 저장 공간을 확인한 뒤 다시 시도하세요.</p>

  <section class="recovery book" id="recovery" hidden>
    <div class="inner">
      <h1>저장된 데이터를 읽을 수 없습니다</h1>
      <p>데이터가 손상되었거나 지원하지 않는 형식입니다. 저장된 원본은 지우지 않았습니다.</p>
      <button class="btn" id="reset-start" type="button">데이터 초기화</button>
      <div id="reset-confirm" role="alert" hidden>
        <p>모든 데이터가 삭제되고 되돌릴 수 없습니다.</p>
        <div class="btn-row">
          <button class="btn go" id="reset-run" type="button">모두 삭제하고 새로 시작</button>
          <button class="btn" id="reset-cancel" type="button">취소</button>
        </div>
      </div>
    </div>
  </section>

  <div class="wrap" id="app" hidden>
    <nav class="tabs" aria-label="메뉴">
      <button class="tab" type="button" data-view="dashboard" aria-current="page">대시보드</button>
      <button class="tab" type="button" data-view="calendar">달력</button>
      <button class="tab" type="button" data-view="settings">설정</button>
      <span class="date" id="today-label"></span>
    </nav>
    <main class="book">
      <div class="inner">
        <section class="panel" data-panel="dashboard"><p class="placeholder">오늘 지출과 이번 달 남은 돈이 여기에 표시됩니다.</p></section>
        <section class="panel" data-panel="calendar" hidden><p class="placeholder">날짜별 지출이 여기에 표시됩니다.</p></section>
        <section class="panel" data-panel="settings" hidden><p class="placeholder">이번 달 금액을 여기에서 고칩니다.</p></section>
      </div>
    </main>
  </div>

  <div id="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-label="매달 첫 정산">
      <form class="dialog-in" id="settle-form" novalidate>
        <div class="dlg-head"><span class="chip" id="settle-step"></span><span class="sub" id="settle-label"></span></div>
        <div class="dlg-title">
          <svg width="44" height="44" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="27" r="17" fill="#E8503F" stroke="#2B4A22" stroke-width="3"></circle><path d="M24 12 L19 5 L24 8 L29 5 Z M14 14 L24 11 L34 14 L24 15 Z" fill="#6FB34A" stroke="#2B4A22" stroke-width="2" stroke-linejoin="round"></path><circle cx="18" cy="27" r="2" fill="#2B4A22"></circle><circle cx="30" cy="27" r="2" fill="#2B4A22"></circle><circle cx="14" cy="32" r="2.5" fill="#F7A19A"></circle><circle cx="34" cy="32" r="2.5" fill="#F7A19A"></circle></svg>
          <h2 id="settle-title" hidden></h2>
        </div>

        <div class="step" data-step="1">
          <div class="result" id="left-result" hidden><div class="top"><span class="chip" id="left-label"></span><strong class="amt" id="left-amount"></strong></div></div>
          <div class="block" id="left-choice" hidden>
            <p class="sec-title" id="left-title"></p>
            <div class="frow">
              <label for="save-amount">저금통에 저축</label>
              <div class="unit"><input class="field right" id="save-amount" data-field="save" inputmode="numeric" autocomplete="off"><span>원</span></div>
            </div>
            <div class="frow">
              <label for="carry-amount">다음 달로 이월</label>
              <div class="unit"><input class="field right" id="carry-amount" data-field="carry" inputmode="numeric" autocomplete="off"><span>원</span></div>
            </div>
          </div>
          <div class="result bad" id="over-result" hidden><div class="top"><span class="over-head"><span class="chip" id="over-label"></span><span class="over-pill">초과</span></span><strong class="amt" id="over-amount"></strong></div></div>
          <fieldset id="over-choice" hidden>
            <legend id="over-title"></legend>
            <div class="opt" id="opt-next"><label><input type="radio" name="over" value="next" data-field="option" checked>다음 달 총 금액에서 차감</label></div>
            <div class="opt" id="opt-keep"><label><input type="radio" name="over" value="keep" data-field="option">그냥 두기</label></div>
            <div class="opt" id="opt-mix">
              <label><input type="radio" name="over" value="mix" data-field="option">저금통에서 차감하고 나머지는 다음 달에서 차감</label>
              <div class="more" id="mix-more" hidden>
                <div class="mix-row">
                  <label class="mix-label" for="piggy-amount" id="piggy-label"></label>
                  <div class="unit"><input class="field right" id="piggy-amount" data-field="piggy" inputmode="numeric" autocomplete="off" aria-describedby="mix-msg"><span>원</span></div>
                </div>
                <span class="mix-msg" id="mix-msg"></span>
              </div>
            </div>
          </fieldset>
          <div class="block">
            <p class="sec-title">이번 달 총 금액</p>
            <div class="frow">
              <label for="base-amount">기본 금액</label>
              <div class="unit"><input class="field right" id="base-amount" data-field="base" inputmode="numeric" autocomplete="off" aria-describedby="settle-error"><span>원</span></div>
            </div>
            <div class="calc"><span>지난달에서 이월</span><span class="tnum" id="calc-carry"></span></div>
            <div class="calc last"><span>지난달 초과분 차감</span><span class="tnum" id="calc-deduction"></span></div>
            <div class="total-box"><span class="total-label">이번 달 총 금액</span><strong class="big" id="calc-total"></strong></div>
            <p class="err" id="settle-error" role="alert" hidden></p>
          </div>
        </div>

        <div class="step" data-step="2" hidden>
          <div class="result yellow"><div class="top"><span class="chip">이번 달 총 금액</span><strong class="amt" id="alloc-total"></strong></div></div>
          <div class="block" id="alloc-rows"></div>
          <div class="add-cat">
            <label class="sr" for="new-cat">새 분류 이름</label>
            <input class="field" id="new-cat" maxlength="12" placeholder="새 분류 이름 (예: 반려동물)" autocomplete="off" aria-describedby="cat-error">
            <button class="btn add-btn" type="button" data-act="add-cat"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1 V13 M1 7 H13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"></path></svg>분류 추가</button>
          </div>
          <p class="err" id="cat-error" role="alert" hidden></p>
          <div class="sum-line sub"><span>배분 합계</span><span class="tnum" id="alloc-sum"></span></div>
          <div class="total-box mint"><span class="total-label">아직 나누지 않은 금액</span><strong class="big" id="alloc-left"></strong></div>
          <p class="sub" id="alloc-hint" role="status" hidden></p>
        </div>

        <div class="actions">
          <button class="btn" id="settle-back" type="button">이전</button>
          <button class="btn go" id="settle-next" type="submit">다음</button>
        </div>
      </form>
    </div>
  </div>

<script>
'use strict';

// ---- 상수 ----

const STORAGE_KEY = 'living-budget';
const DATA_VERSION = 1;
const DEFAULT_CATEGORIES = ['식비', '의류', '취미', '교통', '기타'];
const CATEGORY_NAME_MAX = 10;
const WEEKDAYS = ['월', '화', '수', '목', '금', '토', '일'];

// ---- 금액 유틸 ----

// 원 단위 정수만 받는다. 쉼표는 천 단위 위치에만 허용한다.
function parseAmount(text, { min = 0 } = {}) {
  const raw = String(text ?? '').trim();
  if (raw === '') return { ok: false, error: '금액을 입력하세요.' };
  if (raw.startsWith('-')) return { ok: false, error: '음수는 입력할 수 없습니다.' };
  if (raw.includes('.')) return { ok: false, error: '소수점 없이 원 단위로 입력하세요.' };
  if (!/^(\d+|\d{1,3}(,\d{3})+)$/.test(raw)) return { ok: false, error: '숫자만 입력하세요.' };

  const value = Number(raw.replaceAll(',', ''));
  if (!Number.isSafeInteger(value)) return { ok: false, error: '금액이 너무 큽니다.' };
  if (value < min) return { ok: false, error: `${formatWon(min)} 이상 입력하세요.` };
  return { ok: true, value };
}

// 빈칸을 0원으로 보는 입력칸(분류 배분)에서 쓴다.
function parseOptionalAmount(text) {
  return String(text ?? '').trim() === '' ? { ok: true, value: 0 } : parseAmount(text);
}

function formatWon(amount) {
  return `${(amount || 0).toLocaleString('ko-KR')}원`;
}

function formatSigned(amount) {
  return amount > 0 ? `+${formatWon(amount)}` : formatWon(amount);
}

// ---- 날짜 유틸 ----

// 날짜는 'YYYY-MM-DD', 달은 'YYYY-MM' 문자열로 다룬다.
// toISOString은 UTC로 바뀌어 한국 시간 오전에 날짜가 밀리므로 쓰지 않는다.
function pad2(number) {
  return String(number).padStart(2, '0');
}

function toDateKey(date) {
  return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
}

// 오늘 날짜를 얻는 유일한 함수. 월 전환 테스트는 이 함수만 바꾼다.
function getToday() {
  return toDateKey(new Date());
}

function monthKeyOf(dateKey) {
  return dateKey.slice(0, 7);
}

function addMonths(monthKey, delta) {
  const [year, month] = monthKey.split('-').map(Number);
  const date = new Date(year, month - 1 + delta, 1);
  return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}`;
}

function daysInMonth(monthKey) {
  const [year, month] = monthKey.split('-').map(Number);
  return new Date(year, month, 0).getDate();
}

function monthDates(monthKey) {
  return Array.from({ length: daysInMonth(monthKey) }, (_, i) => `${monthKey}-${pad2(i + 1)}`);
}

// 월요일 0 ~ 일요일 6
function weekdayIndex(dateKey) {
  const [year, month, day] = dateKey.split('-').map(Number);
  return (new Date(year, month - 1, day).getDay() + 6) % 7;
}

// 월~일 단위로 묶는다. 달 경계에 걸친 주에는 해당 달 날짜만 담는다.
function weeksOfMonth(monthKey) {
  const weeks = [];
  for (const dateKey of monthDates(monthKey)) {
    if (weeks.length === 0 || weekdayIndex(dateKey) === 0) weeks.push([]);
    weeks.at(-1).push(dateKey);
  }
  return weeks;
}

function isLockedDate(dateKey) {
  return monthKeyOf(dateKey) < monthKeyOf(getToday());
}

function formatDate(dateKey) {
  const [year, month, day] = dateKey.split('-').map(Number);
  return `${year}년 ${month}월 ${day}일 (${WEEKDAYS[weekdayIndex(dateKey)]})`;
}

function formatMonth(monthKey) {
  const [year, month] = monthKey.split('-').map(Number);
  return `${year}년 ${month}월`;
}

// ---- 저장소 ----

let state = null;

function createId(prefix) {
  return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
}

function createEmptyData() {
  return {
    version: DATA_VERSION,
    categories: DEFAULT_CATEGORIES.map((name) => ({ id: createId('cat'), name, hidden: false })),
    months: {},
    expenses: [],
    piggy: { balance: 0, history: [] },
    unsettled: [],
  };
}

function isPlainObject(value) {
  return typeof value === 'object' && value !== null && !Array.isArray(value);
}

function isValidCategory(category) {
  return isPlainObject(category)
    && typeof category.id === 'string'
    && typeof category.name === 'string'
    && typeof category.hidden === 'boolean';
}

function isValidData(data) {
  return isPlainObject(data)
    && data.version === DATA_VERSION
    && Array.isArray(data.categories)
    && data.categories.every(isValidCategory)
    && isPlainObject(data.months)
    && Array.isArray(data.expenses)
    && isPlainObject(data.piggy)
    && Number.isSafeInteger(data.piggy.balance)
    && Array.isArray(data.piggy.history)
    && Array.isArray(data.unsettled);
}

// 손상된 값은 읽기만 하고 덮어쓰지 않는다. 지우는 것은 사용자가 고른다.
function loadData() {
  let raw = null;
  try {
    raw = localStorage.getItem(STORAGE_KEY);
  } catch {
    return { status: 'empty', data: createEmptyData() };
  }
  if (raw === null) return { status: 'empty', data: createEmptyData() };

  try {
    const data = JSON.parse(raw);
    return isValidData(data) ? { status: 'ok', data } : { status: 'corrupt' };
  } catch {
    return { status: 'corrupt' };
  }
}

function saveData(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  } catch {
    return false;
  }
}

function saveState() {
  document.getElementById('save-error').hidden = saveData(state);
}

// ---- 정산 ----

function needsSettlement(data, monthKey) {
  return data.months[monthKey]?.settled !== true;
}

function lastSettledMonth(data, monthKey) {
  const settled = Object.keys(data.months)
    .filter((key) => key < monthKey && data.months[key].settled === true);
  return settled.sort().at(-1) ?? null;
}

function monthSpent(data, monthKey) {
  return data.expenses
    .filter((expense) => monthKeyOf(expense.date) === monthKey)
    .reduce((sum, expense) => sum + expense.amount, 0);
}

function monthBalance(data, monthKey) {
  return data.months[monthKey].total - monthSpent(data, monthKey);
}

function computeTotal(baseAmount, carryIn, deduction) {
  return baseAmount + carryIn - deduction;
}

// 마지막으로 정산된 달의 결과로 1단계 화면 종류를 정한다.
function settlementContext(data, monthKey) {
  const lastMonth = lastSettledMonth(data, monthKey);
  const piggyBalance = data.piggy.balance;
  if (lastMonth === null) return { mode: 'first', lastMonth, amount: 0, piggyBalance };
  const balance = monthBalance(data, lastMonth);
  if (balance > 0) return { mode: 'leftover', lastMonth, amount: balance, piggyBalance };
  if (balance < 0) return { mode: 'over', lastMonth, amount: -balance, piggyBalance };
  return { mode: 'even', lastMonth, amount: 0, piggyBalance };
}

// 저금통에서 뺄 수 있는 한도
function piggyCap({ amount, piggyBalance }) {
  return Math.min(piggyBalance, amount);
}

// 1단계 입력값으로 총 금액을 계산한다. why는 `다음`을 막는 이유이고 비어 있으면 통과다.
function calcSettlement({ mode, amount, piggyBalance }, { base: baseText, save: saveText, carry: carryText, option, piggy: piggyText }) {
  const empty = String(baseText ?? '').trim() === '';
  const parsed = parseAmount(baseText);
  const base = parsed.ok ? parsed.value : null;
  let carryIn = 0;
  let piggyIn = 0;
  let piggyOut = 0;
  let deduction = 0;
  let choiceWhy = '';
  if (mode === 'over' && option === 'next') deduction = amount;
  if (mode === 'over' && option === 'mix') {
    const piggy = parseOptionalAmount(piggyText);
    if (!piggy.ok) {
      choiceWhy = 'bad';
    } else {
      piggyOut = piggy.value;
      deduction = Math.max(amount - piggy.value, 0);
      if (piggy.value > piggyCap({ amount, piggyBalance })) choiceWhy = 'cap';
    }
  }
  if (mode === 'leftover') {
    const save = parseOptionalAmount(saveText);
    const carry = parseOptionalAmount(carryText);
    if (!save.ok || !carry.ok) {
      choiceWhy = 'bad';
    } else {
      carryIn = carry.value;
      piggyIn = save.value;
      if (save.value + carry.value !== amount) choiceWhy = 'sum';
    }
  }
  const total = computeTotal(base ?? 0, carryIn, deduction);
  let why = '';
  if (!empty && base === null) why = 'base';
  else if (choiceWhy !== '') why = choiceWhy;
  else if (empty) why = 'empty';
  else if (total < 1) why = 'total';
  return { base, carryIn, deduction, piggyIn, piggyOut, total, why, ok: why === '' };
}

// 분류 이름의 오류 문구를 돌려준다. 문제가 없으면 빈 문자열이다.
function categoryNameError(name, categories) {
  const trimmed = name.trim();
  if (trimmed === '') return '분류 이름을 입력해 주세요.';
  if (trimmed.length > CATEGORY_NAME_MAX) return `분류 이름은 ${CATEGORY_NAME_MAX}자 이하로 입력해 주세요.`;
  if (categories.some((category) => category.name === trimmed)) return '이미 있는 분류예요.';
  return '';
}

// 정산에서 정한 목록을 반영한다. 목록에서 빠진 분류는 지출 내역이 있으면 지난 기록을 위해 숨기기만 한다.
function applyCategories(data, drafts) {
  const kept = new Set(drafts.map(({ id }) => id));
  const known = new Set(data.categories.map(({ id }) => id));
  const used = new Set(data.expenses.map((expense) => expense.categoryId));
  const existing = data.categories
    .filter((category) => kept.has(category.id) || used.has(category.id))
    .map((category) => ({ ...category, hidden: !kept.has(category.id) }));
  const added = drafts
    .filter(({ id }) => !known.has(id))
    .map(({ id, name }) => ({ id, name, hidden: false }));
  data.categories = [...existing, ...added];
}

// 정산 결과는 이 함수에서 한 번에 기록한다.
function applySettlement(data, monthKey, { baseAmount, carryIn, deduction, total, allocations, categories }) {
  applyCategories(data, categories);
  data.months[monthKey] = { baseAmount, carryIn, deduction, total, allocations, settled: true };
}

// 분류별 입력값을 더해 아직 나누지 않은 금액을 계산한다. 잘못된 칸은 합계에서 뺀다.
function allocationSummary(categories, texts, total) {
  let sum = 0;
  let bad = false;
  for (const { id } of categories) {
    const parsed = parseOptionalAmount(texts[id]);
    if (parsed.ok) sum += parsed.value;
    else bad = true;
  }
  const left = total - sum;
  return { sum, bad, left, ok: !bad && left === 0 };
}

// ---- 정산 창 ----

// 입력 중인 값은 저장하지 않는다. 끝나기 전에 새로고침하면 창이 처음부터 다시 뜬다.
let settle = null;

const ICON_X = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3 L13 13 M13 3 L3 13" stroke-width="2.5" stroke-linecap="round" fill="none"></path></svg>';
const ICON_NO = '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="8" fill="#FFF1A8" stroke="#2B4A22" stroke-width="2"></circle><path d="M9 4.5 V10 M9 12.5 V13.5" stroke="#2B4A22" stroke-width="2.2" stroke-linecap="round" fill="none"></path></svg>';

function escapeHtml(text) {
  const entities = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  return String(text).replace(/[&<>"']/g, (char) => entities[char]);
}

function currentCalc() {
  return calcSettlement(settle.context, settle.inputs);
}

function settleErrorText({ why }) {
  if (why === 'base') return '기본 금액은 원 단위 숫자만 입력할 수 있어요.';
  if (why === 'total') return '이번 달 총 금액은 1원 이상이어야 해요.';
  if (why === 'bad' && settle.context.mode === 'leftover') return '금액은 원 단위 숫자만 입력할 수 있어요.';
  if (why === 'sum') return `저축과 이월을 더한 금액이 남은 ${formatWon(settle.context.amount)}과 같아야 해요.`;
  return '';
}

function markInvalid(input, invalid) {
  if (invalid) input.setAttribute('aria-invalid', 'true');
  else input.removeAttribute('aria-invalid');
}

// 지난달 결과 부분은 정산 창을 열 때 한 번만 채운다.
function renderLastMonth() {
  const { mode, lastMonth, amount, piggyBalance } = settle.context;
  const leftover = mode === 'leftover';
  const over = mode === 'over';
  document.getElementById('left-result').hidden = !leftover;
  document.getElementById('left-choice').hidden = !leftover;
  document.getElementById('over-result').hidden = !over;
  document.getElementById('over-choice').hidden = !over;
  if (leftover) {
    document.getElementById('left-label').textContent = `${Number(lastMonth.slice(5))}월 남은 돈`;
    document.getElementById('left-amount').textContent = `+${formatWon(amount)}`;
    document.getElementById('left-title').textContent = `남은 ${formatWon(amount)}을 어떻게 할까요?`;
  }
  if (over) {
    document.getElementById('over-label').textContent = `${Number(lastMonth.slice(5))}월 초과 지출`;
    document.getElementById('over-amount').textContent = formatWon(-amount);
    document.getElementById('over-title').textContent = `초과한 ${formatWon(amount)}을 어떻게 할까요?`;
    document.getElementById('piggy-label').textContent = `저금통에서 뺄 금액 (잔액 ${formatWon(piggyBalance)})`;
  }
}

function renderOverChoice({ why }) {
  const { option, piggy } = settle.inputs;
  for (const key of ['next', 'keep', 'mix']) {
    document.getElementById(`opt-${key}`).classList.toggle('on', option === key);
  }
  document.getElementById('mix-more').hidden = option !== 'mix';
  const message = document.getElementById('mix-msg');
  if (why === 'bad') message.innerHTML = `${ICON_NO}금액은 원 단위 숫자만 입력해요`;
  else if (why === 'cap') message.innerHTML = `${ICON_NO}${formatWon(piggyCap(settle.context))}까지만 뺄 수 있어요`;
  else message.innerHTML = '';
  markInvalid(document.getElementById('piggy-amount'), !parseOptionalAmount(piggy).ok || why === 'cap');
}

function renderTotal() {
  const calc = currentCalc();
  const error = document.getElementById('settle-error');
  const base = document.getElementById('base-amount');
  const message = settleErrorText(calc);
  document.getElementById('calc-carry').textContent = `+ ${formatWon(calc.carryIn)}`;
  document.getElementById('calc-deduction').textContent = `- ${formatWon(calc.deduction)}`;
  document.getElementById('calc-total').textContent = formatWon(calc.total);
  error.textContent = message;
  error.hidden = message === '';
  markInvalid(base, calc.why === 'base');
  markInvalid(document.getElementById('save-amount'), !parseOptionalAmount(settle.inputs.save).ok);
  markInvalid(document.getElementById('carry-amount'), !parseOptionalAmount(settle.inputs.carry).ok);
  if (settle.context.mode === 'over') renderOverChoice(calc);
  document.getElementById('settle-next').disabled = !calc.ok;
}

function allocationRow({ id, name }) {
  const safeId = escapeHtml(id);
  const safeName = escapeHtml(name);
  if (settle.confirmId === id) {
    return `<div class="confirm" role="alert">
      <span>${safeName} 분류를 삭제할까요? 이번 달부터 목록에서 빠져요.</span>
      <span class="confirm-btns">
        <button class="btn small" type="button" data-act="del-yes" data-id="${safeId}">삭제</button>
        <button class="btn small" type="button" data-act="del-no" data-id="${safeId}">취소</button>
      </span>
    </div>`;
  }
  const lastOne = settle.categories.length <= 1 ? ' disabled' : '';
  return `<div class="frow">
    <label class="alloc-label" for="alloc-${safeId}">${safeName}</label>
    <div class="unit">
      <input class="field right" id="alloc-${safeId}" data-alloc="${safeId}" inputmode="numeric" autocomplete="off" placeholder="0" value="${escapeHtml(settle.allocations[id] ?? '')}"><span>원</span>
      <button class="x" type="button" data-act="del-ask" data-id="${safeId}" aria-label="${safeName} 분류 삭제"${lastOne}>${ICON_X}</button>
    </div>
  </div>`;
}

// 입력칸을 다시 그리지 않으므로 입력 중에 불러도 포커스가 유지된다.
function renderAllocateSummary() {
  const { sum, bad, left, ok } = allocationSummary(settle.categories, settle.allocations, currentCalc().total);
  const leftEl = document.getElementById('alloc-left');
  const hint = document.getElementById('alloc-hint');
  document.getElementById('alloc-sum').textContent = formatWon(sum);
  leftEl.textContent = formatWon(left);
  leftEl.classList.toggle('neg-text', left < 0);
  hint.textContent = bad ? '금액은 원 단위 숫자만 입력할 수 있어요.' : '';
  hint.hidden = !bad;
  document.getElementById('settle-next').disabled = !ok;
  document.querySelectorAll('[data-alloc]').forEach((input) => {
    markInvalid(input, !parseOptionalAmount(input.value).ok);
  });
}

function renderAllocateStep() {
  document.getElementById('alloc-total').textContent = formatWon(currentCalc().total);
  document.getElementById('alloc-rows').innerHTML = settle.categories.map(allocationRow).join('');
  renderAllocateSummary();
}

function handleAllocationInput(event) {
  const id = event.target.dataset.alloc;
  if (id === undefined) return;
  settle.allocations[id] = event.target.value;
  renderAllocateSummary();
}

function showCategoryError(message) {
  const error = document.getElementById('cat-error');
  error.textContent = message;
  error.hidden = message === '';
}

function addCategory() {
  const input = document.getElementById('new-cat');
  const message = categoryNameError(input.value, settle.categories);
  showCategoryError(message);
  if (message === '') {
    settle.categories.push({ id: createId('cat'), name: input.value.trim() });
    input.value = '';
    renderAllocateStep();
  }
  input.focus();
}

function removeCategory(id) {
  if (settle.categories.length <= 1) return;
  settle.categories = settle.categories.filter((category) => category.id !== id);
  delete settle.allocations[id];
  settle.confirmId = null;
  showCategoryError('');
  renderAllocateStep();
  document.getElementById('new-cat').focus();
}

function handleCategoryClick(event) {
  const button = event.target.closest('[data-act]');
  if (button === null) return;
  const { act, id } = button.dataset;
  if (act === 'add-cat') addCategory();
  if (act === 'del-yes') removeCategory(id);
  if (act === 'del-ask' || act === 'del-no') {
    settle.confirmId = act === 'del-ask' ? id : null;
    renderAllocateStep();
    const next = act === 'del-ask' ? '[data-act="del-no"]' : `[data-act="del-ask"][data-id="${CSS.escape(id)}"]`;
    document.querySelector(next).focus();
  }
}

function saveSettle() {
  const { monthKey, categories, allocations } = settle;
  const { base, carryIn, deduction, total } = currentCalc();
  if (!allocationSummary(categories, allocations, total).ok) return;
  applySettlement(state, monthKey, {
    baseAmount: base,
    carryIn,
    deduction,
    total,
    allocations: Object.fromEntries(categories.map(({ id }) => [id, parseOptionalAmount(allocations[id]).value])),
    categories,
  });
  settle = null;
  saveState();
  enterApp();
}

function renderSettle() {
  const { monthKey, step } = settle;
  const title = document.getElementById('settle-title');
  const firstTitle = settle.context.mode === 'over' ? '지난달 정리하고 이번 달 정해요' : '';
  const titleText = step === 2 ? '분류별로 나눠 주세요' : firstTitle;
  document.getElementById('settle-step').textContent = `${step} / 2 단계`;
  document.getElementById('settle-label').textContent = `${Number(monthKey.slice(5))}월 첫 정산`;
  title.textContent = titleText;
  title.hidden = titleText === '';
  document.querySelectorAll('[data-step]').forEach((panel) => {
    panel.hidden = Number(panel.dataset.step) !== step;
  });
  document.getElementById('settle-back').hidden = step === 1;
  document.getElementById('settle-next').textContent = step === 2 ? '저장하고 시작' : '다음';
  if (step === 1) renderTotal();
  else renderAllocateStep();
  const inputs = document.querySelectorAll(`[data-step="${step}"] input`);
  [...inputs].find((input) => input.offsetParent !== null && (input.type !== 'radio' || input.checked))?.focus();
}

function startSettle(monthKey) {
  settle = {
    monthKey,
    step: 1,
    context: settlementContext(state, monthKey),
    inputs: { base: '', save: '', carry: '', option: 'next', piggy: '' },
    categories: state.categories.filter((category) => !category.hidden).map(({ id, name }) => ({ id, name })),
    allocations: {},
    confirmId: null,
  };
  document.getElementById('settle-form').reset();
  showCategoryError('');
  renderLastMonth();
  renderSettle();
}

function moveSettle(step) {
  settle.step = step;
  renderSettle();
}

function handleSettleInput(event) {
  const { field } = event.target.dataset;
  if (field === undefined) return;
  settle.inputs[field] = event.target.value;
  renderTotal();
}

function handleSettleSubmit(event) {
  event.preventDefault();
  if (settle.step === 2) saveSettle();
  else if (currentCalc().ok) moveSettle(2);
}

// ---- 화면 ----

function showView(name) {
  document.querySelectorAll('[data-panel]').forEach((panel) => {
    panel.hidden = panel.dataset.panel !== name;
  });
  document.querySelectorAll('[data-view]').forEach((item) => {
    if (item.dataset.view === name) item.setAttribute('aria-current', 'page');
    else item.removeAttribute('aria-current');
  });
}

function showRecovery() {
  document.getElementById('recovery').hidden = false;
}

function setResetConfirm(open) {
  document.getElementById('reset-start').hidden = open;
  document.getElementById('reset-confirm').hidden = !open;
}

// 이번 달이 정산되지 않았으면 앱 위에 정산 창을 띄운다. 끝내기 전에는 뒤의 앱을 쓸 수 없다.
function enterApp() {
  const today = getToday();
  const monthKey = monthKeyOf(today);
  const settling = needsSettlement(state, monthKey);
  const app = document.getElementById('app');
  document.getElementById('today-label').textContent = formatDate(today);
  document.getElementById('overlay').hidden = !settling;
  app.hidden = false;
  app.inert = settling;
  if (settling && settle?.monthKey !== monthKey) startSettle(monthKey);
}

function resetData() {
  state = createEmptyData();
  saveState();
  document.getElementById('recovery').hidden = true;
  enterApp();
}

function init() {
  document.querySelectorAll('[data-view]').forEach((item) => {
    item.addEventListener('click', () => showView(item.dataset.view));
  });
  document.getElementById('reset-start').addEventListener('click', () => setResetConfirm(true));
  document.getElementById('reset-cancel').addEventListener('click', () => setResetConfirm(false));
  document.getElementById('reset-run').addEventListener('click', resetData);
  document.getElementById('settle-form').addEventListener('submit', handleSettleSubmit);
  document.getElementById('settle-back').addEventListener('click', () => moveSettle(1));
  document.getElementById('settle-form').addEventListener('input', handleSettleInput);
  document.getElementById('alloc-rows').addEventListener('input', handleAllocationInput);
  document.querySelector('[data-step="2"]').addEventListener('click', handleCategoryClick);
  // 금액을 넣다가 Enter로 바로 저장되지 않게 한다. 저장은 버튼으로만 한다.
  document.querySelector('[data-step="2"]').addEventListener('keydown', (event) => {
    if (event.key !== 'Enter') return;
    if (event.target.id === 'new-cat') {
      event.preventDefault();
      addCategory();
    } else if (event.target.matches('[data-alloc]')) {
      event.preventDefault();
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (state !== null && document.visibilityState === 'visible') enterApp();
  });

  const result = loadData();
  if (result.status === 'corrupt') {
    showRecovery();
    return;
  }
  state = result.data;
  if (result.status === 'empty') saveState();
  enterApp();
}

init();
</script>
</body>
</html>
